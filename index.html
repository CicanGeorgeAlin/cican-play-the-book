<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CICAN — PLAY THE BOOK</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #000;
    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;
}


/* =====================================================
   PAGE
===================================================== */

.page {

    position: relative;

    width: 100vw;
    height: 100vh;

    min-height: 600px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #000;

    overflow: hidden;
}


/* =====================================================
   FLOWING CICAN BACKGROUND
===================================================== */

.flow {

    position: absolute;

    white-space: nowrap;

    color: #fff;

    font-weight: 900;

    letter-spacing: -5px;

    opacity: .035;

    pointer-events: none;

    user-select: none;

    animation:
        moveFlow
        linear
        infinite;
}


.flow-1 {

    top: 5%;

    left: -40%;

    font-size: 100px;

    animation-duration: 32s;
}


.flow-2 {

    top: 27%;

    left: -70%;

    font-size: 55px;

    animation-duration: 24s;

    animation-delay: -9s;

    opacity: .025;
}


.flow-3 {

    top: 52%;

    left: -50%;

    font-size: 150px;

    animation-duration: 38s;

    animation-delay: -20s;

    opacity: .025;
}


.flow-4 {

    top: 77%;

    left: -60%;

    font-size: 70px;

    animation-duration: 27s;

    animation-delay: -14s;

    opacity: .03;
}


@keyframes moveFlow {

    from {
        transform:
            translateX(0);
    }

    to {
        transform:
            translateX(180vw);
    }

}


/* =====================================================
   MAIN
===================================================== */

.content {

    position: relative;

    z-index: 10;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    width: 100%;

    padding: 30px;
}


/* =====================================================
   MAIN CICAN
===================================================== */

.cican {

    width: 145px;
    height: 145px;

    border-radius: 50%;

    background: #fff;

    display: flex;

    align-items: center;
    justify-content: center;

    box-shadow:
        0 0 12px #fff,
        0 0 35px rgba(255,255,255,.95),
        0 0 75px rgba(255,255,255,.55),
        0 0 130px rgba(255,255,255,.2);

    animation:
        breathe
        5s
        ease-in-out
        infinite;

    cursor: pointer;

    transition:
        transform .25s ease;
}


.cican:hover {

    transform:
        scale(1.06);
}


@keyframes breathe {

    0%,
    100% {

        transform:
            translateY(0)
            scale(1);

    }

    50% {

        transform:
            translateY(-10px)
            scale(1.025);

    }

}


/* =====================================================
   EYES
===================================================== */

.eyes {

    display: flex;

    gap: 21px;
}


.eye {

    width: 16px;
    height: 29px;

    background: #000;

    border-radius: 50%;
}


/* =====================================================
   BRAND
===================================================== */

.brand {

    margin-top: 32px;

    font-size:
        clamp(58px, 14vw, 110px);

    line-height: .9;

    font-weight: 900;

    letter-spacing:
        -6px;

    color: #fff;

    text-shadow:
        0 0 10px #fff,
        0 0 30px rgba(255,255,255,.75),
        0 0 65px rgba(255,255,255,.3);
}


/* =====================================================
   PLAY THE BOOK
===================================================== */

.play-title {

    margin-top: 24px;

    font-size:
        clamp(18px, 4vw, 27px);

    font-weight: 700;

    letter-spacing:
        3px;

    color: #fff;
}


/* =====================================================
   15 MINUTES
===================================================== */

.time {

    margin-top: 12px;

    font-size:
        14px;

    letter-spacing:
        4px;

    color:
        #777;
}


/* =====================================================
   PLAY BUTTON
===================================================== */

.play-button {

    margin-top: 32px;

    min-width: 150px;

    padding:
        15px 32px;

    border:
        1px solid #fff;

    border-radius:
        50px;

    background:
        #fff;

    color:
        #000;

    font-size:
        14px;

    font-weight:
        800;

    letter-spacing:
        2px;

    cursor:
        pointer;

    box-shadow:
        0 0 20px rgba(255,255,255,.35);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}


.play-button:hover {

    transform:
        scale(1.06);

    box-shadow:
        0 0 35px rgba(255,255,255,.8);
}


.play-button:active {

    transform:
        scale(.96);
}


/* =====================================================
   BOOK
===================================================== */

.book {

    margin-top: 42px;

    opacity: .8;

    transition:
        opacity .2s ease;
}


.book:hover {

    opacity: 1;
}


.book-name {

    font-size:
        17px;

    font-weight:
        700;

    letter-spacing:
        .5px;
}


.book-author {

    margin-top:
        6px;

    font-size:
        12px;

    color:
        #666;

    letter-spacing:
        1px;
}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    position:
        absolute;

    bottom:
        18px;

    left:
        0;

    width:
        100%;

    text-align:
        center;

    color:
        #333;

    font-size:
        10px;

    letter-spacing:
        2px;

    z-index:
        20;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .cican {

        width:
            115px;

        height:
            115px;
    }


    .eye {

        width:
            13px;

        height:
            24px;
    }


    .eyes {

        gap:
            17px;
    }


    .brand {

        letter-spacing:
            -4px;
    }


    .flow-1 {

        font-size:
            70px;
    }


    .flow-3 {

        font-size:
            95px;
    }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

    .flow,
    .cican {

        animation:
            none;
    }

}

</style>

</head>

<body>


<div class="page">


    <!-- ===============================================
         FLOWING CICAN
    ================================================ -->

    <div class="flow flow-1">
        CICAN CICAN CICAN
    </div>

    <div class="flow flow-2">
        CICAN CICAN CICAN CICAN
    </div>

    <div class="flow flow-3">
        CICAN CICAN CICAN
    </div>

    <div class="flow flow-4">
        CICAN CICAN CICAN CICAN
    </div>


    <!-- ===============================================
         MAIN EXPERIENCE
    ================================================ -->

    <main class="content">


        <!-- MAIN CICAN -->

        <div
            class="cican"
            onclick="playBook()"
            aria-label="Play the book"
        >

            <div class="eyes">

                <div class="eye"></div>

                <div class="eye"></div>

            </div>

        </div>


        <!-- BRAND -->

        <div class="brand">
            CICAN
        </div>


        <!-- PRODUCT -->

        <div class="play-title">
            PLAY THE BOOK
        </div>


        <div class="time">
            15 MINUTES
        </div>


        <!-- PLAY -->

        <button
            class="play-button"
            onclick="playBook()"
        >
            PLAY
        </button>


        <!-- BOOK -->

        <div class="book">

            <div class="book-name">
                Nineteen Eighty-Four
            </div>

            <div class="book-author">
                GEORGE ORWELL
            </div>

        </div>


    </main>


    <!-- ===============================================
         FOOTER
    ================================================ -->

    <div class="footer">
        CICAN
    </div>


</div>


<script>

/* =====================================================
   PLAY BOOK
===================================================== */

function playBook() {

    /*
        The exact locked V14 production experience
        will be connected here.

        V14 itself remains unchanged.
    */

    console.log(
        "CICAN — PLAY THE BOOK"
    );

}

</script>


</body>
</html>
