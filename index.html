<style>

/* =================================================
   RESET
================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =================================================
   ROOT
================================================= */

html {

    background: #000000;

    scroll-behavior: smooth;

}

body {

    min-height: 100vh;

    background: #000000;

    color: #FFFFFF;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;

    overflow-y: auto;

    -webkit-font-smoothing: antialiased;

    text-rendering: optimizeLegibility;

}


/* =================================================
   PAGE
================================================= */

.page {

    position: relative;

    z-index: 1;

    width: 100%;

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    padding:
        32px
        20px
        52px;

}


/* =================================================
   SUBTLE BACKGROUND CICAN TEXT

   This is deliberately extremely subtle.

   The background must never compete with
   the central CICAN.

================================================= */

.background {

    position: fixed;

    inset: 0;

    z-index: 0;

    overflow: hidden;

    pointer-events: none;

    opacity: 0.032;

}


.background-track {

    position: absolute;

    width: max-content;

    white-space: nowrap;

    color: #FFFFFF;

    font-size:
        clamp(
            90px,
            15vw,
            220px
        );

    font-weight: 900;

    letter-spacing: -0.08em;

    line-height: 0.8;

    animation:
        backgroundFlow
        60s
        linear
        infinite;

}


.background-track:nth-child(1) {

    top: 7%;

}


.background-track:nth-child(2) {

    top: 39%;

    animation-duration: 75s;

    animation-direction: reverse;

}


.background-track:nth-child(3) {

    top: 71%;

    animation-duration: 68s;

}


@keyframes backgroundFlow {

    from {

        transform:
            translateX(-30%);

    }

    to {

        transform:
            translateX(0%);

    }

}


/* =================================================
   HERO
================================================= */

.hero {

    width: 100%;

    max-width: 900px;

    min-height: 610px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

}


/* =================================================
   CENTRAL CICAN

   PURE WHITE IS THE MAXIMUM DIGITAL WHITE.

   The glow surrounds the white core.
   The core itself remains #FFFFFF.

================================================= */

.cican-link {

    display: flex;

    align-items: center;

    justify-content: center;

    text-decoration: none;

    margin-bottom: 30px;

    border-radius: 50%;

    -webkit-tap-highlight-color:
        transparent;

}


.cican {

    position: relative;

    width: 150px;

    height: 150px;

    border-radius: 50%;

    background: #FFFFFF;

    /*
       Maximum possible digital white.
       Do not replace with a grey or translucent core.
    */

    box-shadow:

        0 0 16px
        rgba(
            255,
            255,
            255,
            1
        ),

        0 0 38px
        rgba(
            255,
            255,
            255,
            0.82
        ),

        0 0 72px
        rgba(
            255,
            255,
            255,
            0.48
        ),

        0 0 120px
        rgba(
            255,
            255,
            255,
            0.20
        );

    animation:
        breathe
        4s
        ease-in-out
        infinite;

}


@keyframes breathe {

    0%,
    100% {

        transform:
            translateY(0)
            scale(1);

    }

    50% {

        transform:
            translateY(-7px)
            scale(1.02);

    }

}


/* =================================================
   CICAN EYES
================================================= */

.eye {

    position: absolute;

    width: 19px;

    height: 27px;

    background: #000000;

    border-radius: 50%;

    top: 57px;

}


.eye.left {

    left: 43px;

}


.eye.right {

    right: 43px;

}


/* =================================================
   BRAND NAME
================================================= */

.brand {

    color: #FFFFFF;

    font-size:
        clamp(
            56px,
            10vw,
            94px
        );

    line-height: 0.9;

    font-weight: 900;

    letter-spacing: -0.075em;

    margin-left: -0.075em;

}


/* =================================================
   LONG-TERM BRAND STATEMENT

   This is intentionally separate from
   PLAY THE BOOK.

   CICAN = brand
            CICAN SACRED LIBRARY = current product
        -->

        <div class="brand-motto">
            NOT JUST A NAME. CICAN.
        </div>


        <!-- =================================================
             PRODUCT
        ================================================= -->

        <div class="subtitle">
            SACRED LIBRARY
        </div>


        <!-- =================================================
             EXPERIENCE PROMISE
        ================================================= -->

        <div class="minutes">
            EXPERIENCE → UNDERSTAND → READ
        </div>


        <!-- =================================================
             MAIN CTA
        ================================================= -->

        <a
            class="play-button"
            href="library.html"
        >
            PLAY
        </a>


    </section>


    <!-- =================================================
         FOOTER
    ================================================= -->

    <footer class="footer">

        <div class="footer-brand">
            CICAN
        </div>

    </footer>
