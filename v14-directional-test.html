<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>CICAN — PLAY THE BOOK V14 Directional Test</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

/* =========================================
   CICAN
   Directional test visual
========================================= */

.one {
    position: absolute;

    border-radius: 50%;

    background: #fff;

    transform:
        translate3d(-50%, -50%, 0);

    pointer-events: none;

    box-shadow:
        0 0 22px rgba(255,255,255,.8);
}

/* =========================================
   CICAN EYES
========================================= */

.eye {
    position: absolute;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #000;

    pointer-events: none;
}

.eye.left {
    left: 32%;
    top: 39%;
}

.eye.right {
    right: 32%;
    top: 39%;
}

/* =========================================
   LIGHT TRAIL
========================================= */

.trail {
    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #fff;

    pointer-events: none;

    opacity: .65;

    animation:
        trailFade 900ms linear forwards;
}

@keyframes trailFade {

    from {
        opacity: .65;
    }

    to {
        opacity: 0;
    }
}

/* =========================================
   RESET
========================================= */

#reset {

    position: fixed;

    top: 14px;
    right: 14px;

    z-index: 100;

    padding: 8px 13px;

    border: 1px solid
        rgba(255,255,255,.18);

    border-radius: 18px;

    background:
        rgba(0,0,0,.7);

    color: #fff;

    font-size: 11px;

    letter-spacing: 1px;

    touch-action: manipulation;
}
</style>
</head>

<body>

<button id="reset">RESET</button>

<script>

/* =================================================
   CICAN — PLAY THE BOOK
   V14 DIRECTIONAL TEST

   This is a separate experiment.

   Directional behavior is copied from the
   supplied working directional ONE code.

   No magnetism is added.
================================================= */

/* =========================================
   CONSTANTS
========================================= */

const MIN_SIZE = 34;
const MAX_SIZE = 180;

const DOUBLE_TAP_TIME = 350;

const TRAIL_DISTANCE = 35;
const TRAIL_DISTANCE_SQ =
    TRAIL_DISTANCE * TRAIL_DISTANCE;

const MERGE_DISTANCE = 20;
const MERGE_DISTANCE_SQ =
    MERGE_DISTANCE * MERGE_DISTANCE;


/* =========================================
   STATE
========================================= */

let ones = [];

let selectedOne = null;

let isHolding = false;

let lastTapTime = 0;


/* =========================================
   CREATE CICAN
========================================= */

function createOne(x, y, size) {

    const element =
        document.createElement("div");

    element.className = "one";

    element.style.left =
        x + "px";

    element.style.top =
        y + "px";

    element.style.width =
        size + "px";

    element.style.height =
        size + "px";


    /*
       Two eyes are part of the CICAN visual.
    */

    const leftEye =
        document.createElement("div");

    leftEye.className =
        "eye left";


    const rightEye =
        document.createElement("div");

    rightEye.className =
        "eye right";


    element.appendChild(leftEye);
    element.appendChild(rightEye);

    document.body.appendChild(element);


    const one = {

        x,
        y,

        targetX: x,
        targetY: y,

        size,

        element,

        trailX: x,
        trailY: y
    };


    ones.push(one);

    return one;
}


/* =========================================
   UPDATE CICAN
========================================= */

function updateOne(one) {

    /*
       EXACT MASTER MOVEMENT.
    */

    one.x +=
        (one.targetX - one.x) * 0.10;

    one.y +=
        (one.targetY - one.y) * 0.10;


    /*
       Hold-to-grow.
    */

    if (
        one === selectedOne &&
        isHolding
    ) {

        if (one.size < MAX_SIZE) {

            one.size += 0.5;

            if (one.size > MAX_SIZE) {
                one.size = MAX_SIZE;
            }

            const size =
                one.size + "px";

            one.element.style.width =
                size;

            one.element.style.height =
                size;
        }
    }


    /*
       Keep the eyes centered inside the
       moving CICAN by using the parent.
    */

    one.element.style.left =
        one.x + "px";

    one.element.style.top =
        one.y + "px";


    /*
       Trail.
    */

    const dx =
        one.x - one.trailX;

    const dy =
        one.y - one.trailY;

    if (
        dx * dx +
        dy * dy >=
        TRAIL_DISTANCE_SQ
    ) {

        createTrail(
            one.x,
            one.y
        );

        one.trailX =
            one.x;

        one.trailY =
            one.y;
    }
}


/* =========================================
   TRAIL
========================================= */

function createTrail(x, y) {

    const trail =
        document.createElement("div");

    trail.className =
        "trail";

    trail.style.left =
        x + "px";

    trail.style.top =
        y + "px";

    document.body.appendChild(trail);

    setTimeout(
        () => trail.remove(),
        900
    );
}


/* =========================================
   FIND CLOSEST CICAN
========================================= */

function closestOne(x, y) {

    let result = null;

    let bestDistance =
        Infinity;


    for (
        let i = 0;
        i < ones.length;
        i++
    ) {

        const one =
            ones[i];

        const dx =
            one.x - x;

        const dy =
            one.y - y;

        const distance =
            dx * dx +
            dy * dy;


        if (
            distance <
            bestDistance
        ) {

            bestDistance =
                distance;

            result =
                one;
        }
    }

    return result;
}


/* =========================================
   DIRECTIONAL SPLIT
========================================= */

function splitOne(
    one,
    touchX,
    touchY
) {

    if (!one) {
        return;
    }


    let dx =
        touchX - one.x;

    let dy =
        touchY - one.y;


    const distanceSq =
        dx * dx +
        dy * dy;


    /*
       Prevent division by zero.
    */

    if (distanceSq < 1) {

        dx = 1;
        dy = 0;

    } else {

        const distance =
            Math.sqrt(distanceSq);

        dx /= distance;
        dy /= distance;
    }


    /*
       EXACT DIRECTIONAL IDEA:

       New CICAN appears 45px from the
       original in the direction of the
       second tap.
    */

    const newOne =
        createOne(
            one.x + dx * 45,
            one.y + dy * 45,
            MIN_SIZE
        );


    /*
       New CICAN becomes selected.
    */

    selectedOne =
        newOne;

    newOne.targetX =
        newOne.x;

    newOne.targetY =
        newOne.y;
}


/* =========================================
   MERGE
========================================= */

function mergeOnes(a, b) {

    const x =
        (a.x + b.x) * 0.5;

    const y =
        (a.y + b.y) * 0.5;


    const size =
        Math.min(
            MAX_SIZE,
            a.size + b.size
        );


    a.element.remove();
    b.element.remove();


    const ia =
        ones.indexOf(a);

    if (ia !== -1) {
        ones.splice(ia, 1);
    }


    const ib =
        ones.indexOf(b);

    if (ib !== -1) {
        ones.splice(ib, 1);
    }


    selectedOne =
        createOne(
            x,
            y,
            size
        );
}


/* =========================================
   TOUCH START
========================================= */

document.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();


        const touch =
            event.touches[0];


        const x =
            touch.clientX;

        const y =
            touch.clientY;


        const now =
            performance.now();


        /*
           EXACT DOUBLE-TAP TIMING.
        */

        if (
            now - lastTapTime <=
            DOUBLE_TAP_TIME
        ) {

            if (selectedOne) {

                splitOne(
                    selectedOne,
                    x,
                    y
                );
            }


            lastTapTime =
                0;

            isHolding =
                true;

            return;
        }


        /*
           NORMAL TOUCH.
        */

        selectedOne =
            closestOne(
                x,
                y
            );


        if (selectedOne) {

            selectedOne.targetX =
                x;

            selectedOne.targetY =
                y;

            isHolding =
                true;
        }


        lastTapTime =
            now;

    },
    { passive: false }
);


/* =========================================
   TOUCH MOVE
========================================= */

document.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();


        if (!selectedOne) {
            return;
        }


        const touch =
            event.touches[0];


        selectedOne.targetX =
            touch.clientX;

        selectedOne.targetY =
            touch.clientY;

    },
    { passive: false }
);


/* =========================================
   TOUCH END
========================================= */

document.addEventListener(
    "touchend",
    function(event) {

        event.preventDefault();

        isHolding =
            false;

    },
    { passive: false }
);


/* =========================================
   RESET
========================================= */

function resetGame() {

    for (
        let i = 0;
        i < ones.length;
        i++
    ) {

        ones[i].element.remove();
    }


    ones.length =
        0;


    document
        .querySelectorAll(".trail")
        .forEach(
            trail =>
                trail.remove()
        );


    selectedOne =
        null;

    isHolding =
        false;

    lastTapTime =
        0;


    createOne(
        window.innerWidth * 0.5,
        window.innerHeight * 0.5,
        MIN_SIZE
    );
}


/* =========================================
   RESET BUTTON
========================================= */

document
    .getElementById("reset")
    .addEventListener(
        "touchstart",
        function(event) {

            event.preventDefault();
            event.stopPropagation();

            resetGame();

        },
        { passive: false }
    );


/* =========================================
   MAIN LOOP
========================================= */

function animate() {

    /*
       IMPORTANT:
       No magnetism.

       This test follows the directional
       behavior requested.
    */

    for (
        let i = 0;
        i < ones.length;
        i++
    ) {

        updateOne(
            ones[i]
        );
    }


    /*
       Merge only.
    */

    for (
        let i = 0;
        i < ones.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < ones.length;
            j++
        ) {

            const a =
                ones[i];

            const b =
                ones[j];

            const dx =
                b.x - a.x;

            const dy =
                b.y - a.y;

            if (
                dx * dx +
                dy * dy <=
                MERGE_DISTANCE_SQ
            ) {

                mergeOnes(
                    a,
                    b
                );

                break;
            }
        }
    }


    requestAnimationFrame(
        animate
    );
}


/* =========================================
   START
========================================= */

resetGame();

requestAnimationFrame(
    animate
);

</script>

</body>
</html>
