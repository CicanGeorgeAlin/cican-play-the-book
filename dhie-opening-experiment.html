<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>DHIE — Opening Experiment</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}
#stage{position:fixed;inset:0;overflow:hidden}#hud{position:fixed;top:22px;left:50%;transform:translateX(-50%);text-align:center;z-index:20;pointer-events:none;white-space:nowrap}
#department{font-size:10px;letter-spacing:3px;opacity:.55;margin-bottom:7px}#title{font-size:12px;letter-spacing:4px;opacity:.82}
#hint{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:2px;opacity:.45;z-index:20;pointer-events:none;text-align:center;transition:opacity .5s}
.one{position:absolute;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 0 18px rgba(255,255,255,.45);will-change:left,top,width,height;cursor:pointer}
.eye{position:absolute;width:6px;height:8px;border-radius:50%;background:#000;top:10px}.eye.a{left:9px}.eye.b{right:9px}
.trail{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.18;pointer-events:none}
.flash{position:absolute;border:1px solid rgba(255,255,255,.8);border-radius:50%;pointer-events:none;animation:expand .8s ease-out forwards}
@keyframes expand{from{transform:scale(.2);opacity:.9}to{transform:scale(1.8);opacity:0}}
#choice{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:40;background:rgba(0,0,0,.18)}
.choiceBox{text-align:center;pointer-events:none}.choiceTitle{font-size:12px;letter-spacing:5px;margin-bottom:22px;opacity:.7}
.choiceItems{display:flex;gap:34px;justify-content:center}.choiceItem{font-size:14px;letter-spacing:4px;opacity:.9;pointer-events:auto;cursor:pointer;padding:14px 18px;border:1px solid rgba(255,255,255,.18)}
.choiceItem:hover{border-color:rgba(255,255,255,.55)}
#result{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;background:#000;text-align:center}
.resultMain{font-size:18px;letter-spacing:7px}.resultSub{margin-top:15px;font-size:10px;letter-spacing:3px;opacity:.5}
#back{position:fixed;right:18px;top:18px;z-index:60;background:none;color:#fff;border:1px solid rgba(255,255,255,.2);padding:8px 10px;font-size:9px;letter-spacing:2px}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"><div id="department">DEPARTMENT OF HUMAN INTELLIGENCE AND EVOLUTION</div><div id="title">OPENING EXPERIMENT</div></div>
<div id="hint">GROW</div><button id="back">BACK</button>
<div id="choice"><div class="choiceBox"><div class="choiceTitle">YOU CREATED SOMETHING</div><div class="choiceItems"><div class="choiceItem" id="readChoice">READ</div><div class="choiceItem" id="deeperChoice">GO DEEPER</div></div></div></div>
<div id="result"><div><div class="resultMain" id="resultMain"></div><div class="resultSub" id="resultSub"></div></div></div>
<script>
const MIN_SIZE=34,MAX_SIZE=180,MERGE_DISTANCE=20,DOUBLE_TAP_TIME=350,TRAIL_DISTANCE=35;
const stage=document.getElementById('stage'),hint=document.getElementById('hint');let ones=[],selectedOne=null,lastTap=0,mergeCount=0,locked=false,raf=0;
function createOne(x,y,size=MIN_SIZE){const el=document.createElement('div');el.className='one';el.innerHTML='<span class="eye a"></span><span class="eye b"></span>';stage.appendChild(el);const one={el,x,y,targetX:x,targetY:y,size,lastTrailX:x,lastTrailY:y};ones.push(one);return one}
function render(o){o.el.style.width=o.size+'px';o.el.style.height=o.size+'px';o.el.style.left=(o.x-o.size/2)+'px';o.el.style.top=(o.y-o.size/2)+'px'}
function setHint(t,o=.45){hint.textContent=t;hint.style.opacity=o}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function flash(x,y,s){const f=document.createElement('div');f.className='flash';f.style.width=s+'px';f.style.height=s+'px';f.style.left=(x-s/2)+'px';f.style.top=(y-s/2)+'px';stage.appendChild(f);setTimeout(()=>f.remove(),800)}
function trail(o){if(Math.hypot(o.x-o.lastTrailX,o.y-o.lastTrailY)<TRAIL_DISTANCE)return;const t=document.createElement('div');t.className='trail';t.style.left=o.x+'px';t.style.top=o.y+'px';stage.appendChild(t);setTimeout(()=>t.remove(),500);o.lastTrailX=o.x;o.lastTrailY=o.y}
function grow(o){if(o!==selectedOne||locked)return;o.size=Math.min(MAX_SIZE,o.size+.5);if(o.size>=MAX_SIZE)setHint('FULL — CREATE ANOTHER',.7)}
function splitOne(o){if(locked||o.size<MAX_SIZE)return;const a=Math.random()*Math.PI*2,d=o.size*.8,n=createOne(o.x+Math.cos(a)*d,o.y+Math.sin(a)*d);n.targetX=o.x+Math.cos(a)*d;n.targetY=o.y+Math.sin(a)*d;setHint('GROW',.55);selectedOne=n}
function merge(a,b){locked=true;mergeCount++;const x=(a.x+b.x)/2,y=(a.y+b.y)/2;a.el.remove();b.el.remove();ones=ones.filter(o=>o!==a&&o!==b);flash(x,y,Math.max(a.size,b.size));const n=createOne(x,y,MAX_SIZE);selectedOne=n;setTimeout(()=>{locked=false;if(mergeCount===1){setHint('SOMETHING NEW — EXPLORE',.75);document.getElementById('choice').style.display='flex'}else{setHint('GO DEEPER',.8);showResult('DHIE','THE EXPERIMENT CONTINUES')}},850)}
function checkMerge(){if(locked)return;for(let i=0;i<ones.length;i++)for(let j=i+1;j<ones.length;j++){const a=ones[i],b=ones[j];if(a.size>=MAX_SIZE&&b.size>=MAX_SIZE&&dist(a,b)<=MERGE_DISTANCE){merge(a,b);return}}}
function showResult(a,b){document.getElementById('resultMain').textContent=a;document.getElementById('resultSub').textContent=b;document.getElementById('result').style.display='flex'}
function pointerDown(e){if(locked)return;const now=performance.now(),o=ones.find(v=>Math.hypot(v.x-e.clientX,v.y-e.clientY)<v.size/2+30);if(o){selectedOne=o;if(now-lastTap<DOUBLE_TAP_TIME){splitOne(o);lastTap=0;return}lastTap=now}else if(selectedOne&&selectedOne.size>=MAX_SIZE)splitOne(selectedOne)}
function pointerMove(e){if(selectedOne&&!locked){selectedOne.targetX=e.clientX;selectedOne.targetY=e.clientY}}
function pointerUp(){selectedOne=null}
function animate(){for(const o of ones){o.x+=(o.targetX-o.x)*.10;o.y+=(o.targetY-o.y)*.10;render(o);trail(o);if(o===selectedOne)grow(o)}checkMerge();raf=requestAnimationFrame(animate)}
document.addEventListener('pointerdown',pointerDown,{passive:true});document.addEventListener('pointermove',pointerMove,{passive:true});document.addEventListener('pointerup',pointerUp,{passive:true});
document.getElementById('readChoice').onclick=()=>showResult('READ','THE TEXT AWAITS');document.getElementById('deeperChoice').onclick=()=>showResult('DHIE','THE EXPERIMENT CONTINUES');document.getElementById('back').onclick=()=>location.href='index.html';
const first=createOne(innerWidth/2,innerHeight/2);selectedOne=first;setHint('GROW',.7);render(first);raf=requestAnimationFrame(animate);
</script>
</body>
</html>
