<style>

/* =================================================
   BASE
================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    touch-action: none;
}

body {

    position: relative;

    font-family:
        Arial,
        sans-serif;

    color: #fff;
}


/* =================================================
   CICAN
================================================= */

.one {

    position: absolute;

    border-radius: 50%;

    background: #fff;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    box-shadow:
        0 0 10px #fff,
        0 0 25px rgba(255,255,255,0.8),
        0 0 45px rgba(255,255,255,0.4);
}


/* =================================================
   CICAN FACE
================================================= */

.cican-face {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 42%;
    height: 42%;

    transform:
        translate(-50%, -50%);

    pointer-events: none;
}

.eye {

    position: absolute;

    width: 22%;
    height: 34%;

    top: 28%;

    background: #000;

    border-radius: 50%;
}

.eye.left {
    left: 18%;
}

.eye.right {
    right: 18%;
}


/* =================================================
   MERGED CICAN
================================================= */

.memory-one {

    box-shadow:
        0 0 12px #fff,
        0 0 30px #fff,
        0 0 55px rgba(255,255,255,0.9);
}


/* =================================================
   TRAIL
================================================= */

.trail {

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #fff;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    opacity: 0.8;

    box-shadow:
        0 0 6px #fff;

    animation:
        fadeTrail 1.5s linear forwards;
}

@keyframes fadeTrail {

    from {
        opacity: 0.8;
    }

    to {
        opacity: 0;
    }
}


/* =================================================
   HUD
================================================= */

#hud {

    position: fixed;

    top: 18px;
    left: 18px;

    z-index: 1000;

    color: #fff;

    pointer-events: none;

    user-select: none;

#brand {

    font-size: 17px;

}

#subtitle {

/* =================================================
   RESET
================================================= */

#reset {

}


/* =================================================
   READ OBJECT
================================================= */

.knowledge {

    width: 68px;
    height: 68px;

    border-radius: 50%;

    background: #fff;

   PROLOGUE
================================================= */

/* =================================================

#readerHUD {

<script>

(function () {

    const library = {

        "1984":
            "books/nineteen-eighty-four.js",

        "gatsby":
            "books/the-great-gatsby.js",

        "meditations":
            "books/meditations.js",

        "frankenstein":
            "books/frankenstein.js",

        "dracula":
            "books/dracula.js"

    };


    const key =
        window.location.hash
            .substring(1)
            .toLowerCase();


    const book =
        library[key] ||
        library["1984"];


    document.write(
        '<script src="' +
        book +
        '"><\/script>'
    );

})();

</script>


<script>

/* =================================================
   V15 ENGINE
================================================= */


/* =================================================
   V13 CONSTANTS
================================================= */

const MIN_SIZE = 34;

const MAX_SIZE = 180;

const DOUBLE_TAP_TIME = 350;

const TRAIL_DISTANCE = 35;

const MERGE_DISTANCE = 20;


/* =================================================
   BOOK ORDER
================================================= */

const BOOK_ORDER = [

    "1984",

    "gatsby",

    "meditations",

    "frankenstein",

    "dracula"

];


/* =================================================
   PLAYABLE CICAN
================================================= */

let ones = [];

let selectedOne = null;

let growing = false;

let lastTap = 0;

let lastTappedOne = null;


/* =================================================
   READ OBJECTS
================================================= */

let readObjects = [];

let currentBook = null;


/* =================================================
   PHASE D
================================================= */

let progressingToNextBook =
    false;


/* =================================================
   READER STATE
================================================= */

let readerAnimation = null;

let readerPaused = false;

let readerComplete = false;

let readerSeconds = 900;

let readerLastTime = 0;

let readerScrollPosition = 0;

const TARGET_READING_SECONDS = 900;


/* =================================================
   BOOK
================================================= */

const BOOK_READ =
    window.BOOK_READ;


/* =================================================
   BOOK UI
================================================= */

document.getElementById(
    "subtitle"
).textContent =
    BOOK_READ.title;


document.getElementById(
    "prologueTitle"
).textContent =
    BOOK_READ.title;


document.getElementById(
    "readerTitle"
).textContent =
    BOOK_READ.title;


/* =================================================
   DISTANCE
================================================= */

function distance(
    ax,
    ay,
    bx,
    by
) {

    const dx =
        bx - ax;

    const dy =
        by - ay;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =================================================
   CREATE CICAN
================================================= */

function createOne(
    px,
    py,
    startingSize = MIN_SIZE,
    isMemory = false
) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "one";


    if (isMemory) {

        element.classList.add(
            "memory-one"
        );
    }


    /*
        CICAN FACE
    */

    element.innerHTML =

        '<div class="cican-face">' +

            '<div class="eye left"></div>' +

            '<div class="eye right"></div>' +

        '</div>';


    document.body.appendChild(
        element
    );


    const one = {

        x: px,

        y: py,

        targetX: px,

        targetY: py,

        size: startingSize,

        element: element,

        lastTrailX: px,

        lastTrailY: py

    };


    ones.push(one);


    updateOne(one);


    return one;
}


/* =================================================
   UPDATE CICAN
================================================= */

function updateOne(one) {

    one.element.style.left =
        one.x + "px";


    one.element.style.top =
        one.y + "px";


    one.element.style.width =
        one.size + "px";


    one.element.style.height =
        one.size + "px";
}


/* =================================================
   TRAIL
================================================= */

function createTrail(
    px,
    py
) {

    const trail =
        document.createElement(
            "div"
        );


    trail.className =
        "trail";


    trail.style.left =
        px + "px";


    trail.style.top =
        py + "px";


    document.body.appendChild(
        trail
    );


    setTimeout(
        function () {

            trail.remove();

        },
        1500
    );
}


/* =================================================
   SPLIT
================================================= */

function splitOne(one) {

    const newOne =
        createOne(
            one.x + 45,
            one.y,
            MIN_SIZE,
            false
        );


    newOne.targetX =
        newOne.x;


    newOne.targetY =
        newOne.y;


    selectedOne =
        one;


    growing =
        false;
}


/* =================================================
   MERGE CICAN
================================================= */

function mergeOnes(
    oneA,
    oneB
) {

    const createsKnowledge =

        oneA.size >= MAX_SIZE &&

        oneB.size >= MAX_SIZE;


    const mergeX =
        (
            oneA.x +
            oneB.x
        ) / 2;


    const mergeY =
        (
            oneA.y +
            oneB.y
        ) / 2;


    const mergedSize =
        Math.min(
            MAX_SIZE,
            oneA.size +
            oneB.size
        );


    oneA.element.remove();

    oneB.element.remove();


    ones =
        ones.filter(
            function (one) {

                return (
                    one !== oneA &&
                    one !== oneB
                );

            }
        );


    const merged =
        createOne(
            mergeX,
            mergeY,
            mergedSize,
            true
        );


    selectedOne =
        merged;


    growing =
        false;


    if (
        createsKnowledge
    ) {

        createKnowledge(
            mergeX,
            mergeY
        );
    }
}


/* =================================================
   CHECK CICAN MERGES
================================================= */

function checkMerges() {

    if (
        ones.length < 2
    ) {

        return;
    }


    for (
        let i = 0;
        i < ones.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < ones.length;
            j++
        ) {

            const oneA =
                ones[i];


            const oneB =
                ones[j];


            const d =
                distance(
                    oneA.x,
                    oneA.y,
                    oneB.x,
                    oneB.y
                );


            if (
                d <=
                MERGE_DISTANCE
            ) {

                mergeOnes(
                    oneA,
                    oneB
                );

                return;
            }
        }
    }
}


/* =================================================
   CREATE READ
================================================= */

function createKnowledge(
    px,
    py
) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "knowledge";


    element.textContent =
        "READ";


    element.style.left =
        px + "px";


    element.style.top =
        py + "px";


    document.body.appendChild(
        element
    );


    const knowledge = {

        x: px,

        y: py,

        targetX: px,

        targetY: py,

        element: element,

        dragging: false,

        moved: false,

        downX: 0,

        downY: 0

    };


    readObjects.push(
        knowledge
    );


    element.addEventListener(
        "pointerdown",
        function (e) {

            e.preventDefault();

            e.stopPropagation();


            knowledge.dragging =
                true;


            knowledge.moved =
                false;


            knowledge.downX =
                e.clientX;


            knowledge.downY =
                e.clientY;


            element.classList.add(
                "dragging"
            );


            try {

                element.setPointerCapture(
                    e.pointerId
                );

            } catch (_) {}

        }
    );


    element.addEventListener(
        "pointermove",
        function (e) {

            if (
                !knowledge.dragging
            ) {

                return;
            }


            e.preventDefault();

            e.stopPropagation();


            if (
                distance(
                    e.clientX,
                    e.clientY,
                    knowledge.downX,
                    knowledge.downY
                ) > 8
            ) {

                knowledge.moved =
                    true;
            }


            knowledge.targetX =
                e.clientX;


            knowledge.targetY =
                e.clientY;
        }
    );


    function endPointer(e) {

        if (
            !knowledge.dragging
        ) {

            return;
        }


        e.preventDefault();

        e.stopPropagation();


        knowledge.dragging =
            false;


        element.classList.remove(
            "dragging"
        );


        if (
            !knowledge.moved
        ) {

            openPrologue();
        }
    }


    element.addEventListener(
        "pointerup",
        endPointer
    );


    element.addEventListener(
        "pointercancel",
        function (e) {

            e.preventDefault();

            e.stopPropagation();


            knowledge.dragging =
                false;


            element.classList.remove(
                "dragging"
            );
        }
    );
}


/* =================================================
   UPDATE READ
================================================= */

function updateKnowledge(
    knowledge
) {

    const half =
        34;


    knowledge.targetX =
        Math.max(
            half,
            Math.min(
                window.innerWidth - half,
                knowledge.targetX
            )
        );


    knowledge.targetY =
        Math.max(
            half,
            Math.min(
                window.innerHeight - half,
                knowledge.targetY
            )
        );


    knowledge.x +=
        (
            knowledge.targetX -
            knowledge.x
        ) * 0.10;


    knowledge.y +=
        (
            knowledge.targetY -
            knowledge.y
        ) * 0.10;


    knowledge.element.style.left =
        knowledge.x + "px";


    knowledge.element.style.top =
        knowledge.y + "px";
}


/* =================================================
   CURRENT BOOK
================================================= */

function getCurrentBookKey() {

    const key =
        window.location.hash
            .substring(1)
            .toLowerCase();


    if (
        BOOK_ORDER.includes(key)
    ) {

        return key;
    }


    return "1984";
}


/* =================================================
   NEXT BOOK
================================================= */

function getNextBookKey() {

    const currentKey =
        getCurrentBookKey();


    const currentIndex =
        BOOK_ORDER.indexOf(
            currentKey
        );


    if (
        currentIndex < 0
    ) {

        return null;
    }


    if (
        currentIndex >=
        BOOK_ORDER.length - 1
    ) {

        return null;
    }


    return BOOK_ORDER[
        currentIndex + 1
    ];
}


/* =================================================
   READ + READ
================================================= */

function checkForReadMerges() {

    if (
        readObjects.length < 2
    ) {

        return;
    }


    if (
        progressingToNextBook
    ) {

        return;
    }


    for (
        let i = 0;
        i < readObjects.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < readObjects.length;
            j++
        ) {

            const readA =
                readObjects[i];


            const readB =
                readObjects[j];


            const d =
                distance(
                    readA.x,
                    readA.y,
                    readB.x,
                    readB.y
                );


            if (
                d <=
                MERGE_DISTANCE
            ) {

                mergeReadObjects(
                    readA,
                    readB
                );

                return;
            }
        }
    }
}


/* =================================================
   MERGE READ OBJECTS
================================================= */

function mergeReadObjects(
    readA,
    readB
) {

    const nextBook =
        getNextBookKey();


    /*
        DRACULA IS THE LAST BOOK.
    */

    if (
        !nextBook
    ) {

        return;
    }


    progressingToNextBook =
        true;


    const mergeX =
        (
            readA.x +
            readB.x
        ) / 2;


    const mergeY =
        (
            readA.y +
            readB.y
        ) / 2;


    readA.element.remove();

    readB.element.remove();


    readObjects =
        readObjects.filter(
            function (read) {

                return (
                    read !== readA &&
                    read !== readB
                );

            }
        );


    const mergedElement =
        document.createElement(
            "div"
        );


    mergedElement.className =
        "knowledge";


    mergedElement.textContent =
        "READ";


    mergedElement.style.left =
        mergeX + "px";


    mergedElement.style.top =
        mergeY + "px";


    mergedElement.style.transform =
        "translate(-50%, -50%) scale(1.25)";


    document.body.appendChild(
        mergedElement
    );


    setTimeout(
        function () {

            mergedElement.remove();


            window.location.href =
                "v15.html#" +
                nextBook;

        },
        700
    );
}


/* =================================================
   POINTER DOWN
================================================= */

function pointerDown(
    x,
    y
) {

    if (
        document
            .getElementById(
                "reader"
            )
            .classList
            .contains("open")
    ) {

        return;
    }


    if (
        document
            .getElementById(
                "prologue"
            )
            .classList
            .contains("open")
    ) {

        return;
    }


    let closest =
        null;


    let closestDistance =
        Infinity;


    for (
        const one of ones
    ) {

        const d =
            distance(
                x,
                y,
                one.x,
                one.y
            );


        if (
            d <
            one.size / 2 &&
            d <
            closestDistance
        ) {

            closest =
                one;


            closestDistance =
                d;
        }
    }


    if (!closest) {

        growing =
            false;

        return;
    }


    selectedOne =
        closest;


    const now =
        performance.now();


    if (
        closest ===
        lastTappedOne &&
        now - lastTap <=
        DOUBLE_TAP_TIME
    ) {

        splitOne(
            closest
        );


        lastTap =
            0;


        lastTappedOne =
            null;


        growing =
            false;


        return;
    }


    lastTap =
        now;


    lastTappedOne =
        closest;


    growing =
        true;


    closest.targetX =
        x;


    closest.targetY =
        y;
}


/* =================================================
   POINTER MOVE
================================================= */

function pointerMove(
    x,
    y
) {

    if (
        selectedOne &&
        growing
    ) {

        selectedOne.targetX =
            x;


        selectedOne.targetY =
            y;
    }
}


/* =================================================
   POINTER UP
================================================= */

function pointerUp() {

    growing =
        false;
}


/* =================================================
   GLOBAL POINTER EVENTS
================================================= */

document.addEventListener(

        if (
            e.target.closest(

);


document.addEventListener(

        if (
            e.target.closest(

            )
        ) {

            return;
        }


        if (
            e.target.closest(
                "#prologue"
            )
        ) {

            return;

        if (
            e.target.closest(
                ".knowledge"
            )
        ) {

        if (

        ) {

document.addEventListener(

/* =================================================
   PROLOGUE
================================================= */

const prologue =
    document.getElementById(
        "prologue"
    );


const prologueText =
    document.getElementById(
        "prologueText"
    );


const prologueStep =

    );


const prologueButton =

const prologueScenes =

let prologueIndex =

function openPrologue() {

prologueButton.addEventListener(

            prologueIndex <

        ) {

            prologueIndex++;


            showPrologueScene();


            return;

        closePrologue();

    }
);


/* =================================================
   READER ELEMENTS
================================================= */

const reader =
    document.getElementById(
        "reader"
    );


const readerText =
    document.getElementById(
        "readerText"
    );


const readerPause =
    document.getElementById(
        "readerPause"
    );


const readerClose =
    document.getElementById(
        "readerClose"
    );


const readerStatus =
    document.getElementById(
        "readerStatus"
    );


/* =================================================
   FORMAT TIME
================================================= */

function formatTime(
    seconds
) {

    const s =
        Math.max(
            0,
            Math.floor(seconds)
        );


    return String(
        Math.floor(
            s / 60
        )
    ).padStart(
        2,
        "0"
    )
    +
    ":"
    +
    String(
        s % 60
    ).padStart(
        2,
        "0"
    );
}


/* =================================================
   READER UI
================================================= */

function updateReaderUI() {

    const maxScroll =
        Math.max(
            1,
            readerText.scrollHeight -
            readerText.clientHeight
        );


    const progress =
        Math.min(
            1,
            Math.max(
                0,
                readerScrollPosition /
                maxScroll
            )
        );


    const percent =
        progress * 100;


    document.getElementById(
        "readerTimer"
    ).textContent =
        formatTime(
            readerSeconds
        );


    document.getElementById(
        "readerPercent"
    ).textContent =
        Math.floor(
            percent
        ) +
        "%";


    document.getElementById(
        "readerProgressBar"
    ).style.width =
        percent +
        "%";
}


/* =================================================
   STOP READER
================================================= */

function stopReaderAnimation() {

    if (
        readerAnimation !==
        null
    ) {

        cancelAnimationFrame(
            readerAnimation
        );


        readerAnimation =
            null;
    }
}


/* =================================================
   OPEN READER
================================================= */

function openReader() {

    stopReaderAnimation();


    currentBook =
        BOOK_READ;


    readerPaused =
        false;


    readerComplete =
        false;


    readerSeconds =
        TARGET_READING_SECONDS;


    readerScrollPosition =
        0;


    readerText.textContent =
        currentBook.text;


    readerText.scrollTop =
        0;


    readerPause.textContent =
        "PAUSE";


    readerStatus.textContent =
        "AUTO-READING";


    reader.classList.add(
        "open"
    );


    requestAnimationFrame(
        function () {

            readerScrollPosition =
                0;


            readerLastTime =
                performance.now();


            updateReaderUI();


            readerAnimation =
                requestAnimationFrame(
                    fluidAutoReader
                );
        }
    );
}


/* =================================================
   FLUID AUTO READER
================================================= */

function fluidAutoReader(
    now
) {

    if (
        readerComplete
    ) {

        return;
    }


    const delta =
        Math.min(
            0.05,
            (
                now -
                readerLastTime
            ) / 1000
        );


    readerLastTime =
        now;


    if (
        readerPaused
    ) {

        readerAnimation =
            requestAnimationFrame(
                fluidAutoReader
            );


        return;
    }


    const maxScroll =
        Math.max(
            0,
            readerText.scrollHeight -
            readerText.clientHeight
        );


    if (
        maxScroll <= 0
    ) {

        finishReader();

        return;
    }


    const pixelsPerSecond =
        maxScroll /
        TARGET_READING_SECONDS;


    readerScrollPosition +=
        pixelsPerSecond *
        delta;


    readerScrollPosition =
        Math.min(
            maxScroll,
            readerScrollPosition
        );


    readerText.scrollTop =
        readerScrollPosition;


    const progress =
        readerScrollPosition /
        maxScroll;


    readerSeconds =
        Math.max(
            0,
            TARGET_READING_SECONDS *
            (1 - progress)
        );


    updateReaderUI();


    if (
        readerScrollPosition >=
        maxScroll - 1
    ) {

        finishReader();

        return;
    }


    readerAnimation =
        requestAnimationFrame(
            fluidAutoReader
        );
}


/* =================================================
   FINISH READER
================================================= */

function finishReader() {

    if (
        readerComplete
    ) {

        return;
    }


    readerComplete =
        true;


    stopReaderAnimation();


    readerText.scrollTop =
        readerText.scrollHeight;


    readerScrollPosition =
        Math.max(
            0,
            readerText.scrollHeight -
            readerText.clientHeight
        );


    readerSeconds =
        0;


    document.getElementById(
        "readerTimer"
    ).textContent =
        "00:00";


    document.getElementById(
        "readerPercent"
    ).textContent =
        "100%";


    document.getElementById(
        "readerProgressBar"
    ).style.width =
        "100%";


    readerStatus.textContent =
        "COMPLETE";


    readerPause.textContent =
        "READ AGAIN";
}


/* =================================================
   PAUSE / RESUME
================================================= */

readerPause.addEventListener(
    "pointerdown",
    function (e) {

        e.preventDefault();

        e.stopPropagation();


        if (
            !currentBook
        ) {

            return;
        }


        if (
            readerComplete
        ) {

            openReader();

            return;
        }


        if (
            readerPaused
        ) {

            readerPaused =
                false;


            readerLastTime =
                performance.now();


            readerPause.textContent =
                "PAUSE";


            readerStatus.textContent =
                "AUTO-READING";


            return;
        }


        readerPaused =
            true;


        readerPause.textContent =
            "RESUME";


        readerStatus.textContent =
            "PAUSED";
    }
);


/* =================================================
   CLOSE READER
================================================= */

function closeReader() {

    stopReaderAnimation();


    currentBook =
        null;


    readerPaused =
        false;


    readerComplete =
        false;


    readerSeconds =
        TARGET_READING_SECONDS;


    readerScrollPosition =
        0;


    readerText.textContent =
        "";


    readerText.scrollTop =
        0;


    reader.classList.remove(
        "open"
    );


    readerPause.textContent =
        "PAUSE";


    readerStatus.textContent =
        "AUTO-READING";


    updateReaderUI();
}


readerClose.addEventListener(
    "pointerdown",
    function (e) {

        e.preventDefault();

        e.stopPropagation();


        closeReader();
    }
);


/* =================================================
   RESET
================================================= */

function resetGame() {

    closeReader();

    closePrologue();


    for (
        const one of ones
    ) {

        one.element.remove();
    }


    ones = [];


    for (
        const knowledge of readObjects
    ) {

        knowledge.element.remove();
    }


    readObjects = [];


    document
        .querySelectorAll(
            ".trail"
        )
        .forEach(
            function (element) {

                element.remove();

            }
        );


    selectedOne =
        createOne(
            window.innerWidth / 2,
            window.innerHeight / 2,
            MIN_SIZE,
            false
        );


    growing =
        false;


    lastTap =
        0;


    lastTappedOne =
        null;


    progressingToNextBook =
        false;
}


/* =================================================
   RESET BUTTON
================================================= */

document.getElementById(
    "reset"
).addEventListener(
    "pointerdown",
    function (e) {

        e.preventDefault();

        e.stopPropagation();


        resetGame();
    }
);


/* =================================================
   START CICAN
================================================= */

selectedOne =
    createOne(
        window.innerWidth / 2,
        window.innerHeight / 2,
        MIN_SIZE,
        false
    );


/* =================================================
   MAIN LOOP
================================================= */

function animate() {


    /*
        V13 MOVEMENT

        x +=
        (targetX - x)
        * 0.10

        y +=
        (targetY - y)
        * 0.10
    */

    for (
        const one of ones
    ) {

        one.x +=
            (
                one.targetX -
                one.x
            ) * 0.10;


        one.y +=
            (
                one.targetY -
                one.y
            ) * 0.10;


        /*
            GROWTH
        */

        if (
            growing &&
            selectedOne === one
        ) {

            one.size +=
                0.5;


            if (
                one.size >
                MAX_SIZE
            ) {

                one.size =
                    MAX_SIZE;
            }
        }


        /*
            TRAIL
        */

        if (
            distance(
                one.x,
                one.y,
                one.lastTrailX,
                one.lastTrailY
            ) >=
            TRAIL_DISTANCE
        ) {

            createTrail(
                one.x,
                one.y
            );


            one.lastTrailX =
                one.x;


            one.lastTrailY =
                one.y;
        }


        updateOne(
            one
        );
    }


    /*
        FULL + FULL
        =
        READ
    */

    checkMerges();


    /*
        UPDATE READ
    */

    for (
        const knowledge of readObjects
    ) {

        updateKnowledge(
            knowledge
        );
    }


    /*
        READ + READ
        =
        NEXT BOOK
    */

    checkForReadMerges();


    requestAnimationFrame(
        animate
    );
}


animate();
