<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CICAN — PLAY THE BOOK V14 Directional Timer Test</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="v14Frame" src="v14.html" title="CICAN — PLAY THE BOOK V14"></iframe>

<script>
/*
==================================================
CICAN — PLAY THE BOOK
V14 DIRECTIONAL + TIMER DESIGN TEST

SAFE EXPERIMENT:
- v14.html is loaded unchanged.
- This file adds only:
  1. a smaller/refined draggable reader HUD
  2. directional double-tap splitting in the game
- V14 reader timing/scrolling/pause/completion are untouched.
==================================================
*/

const frame = document.getElementById("v14Frame");

frame.addEventListener("load", function () {
    const win = frame.contentWindow;
    const doc = frame.contentDocument;

    if (!win || !doc) return;

    /*
    ==================================================
    REFINED DRAGGABLE READER HUD
    ==================================================
    */

    const hud = doc.getElementById("readerHUD");
    const panel = doc.querySelector(".reader-panel");

    if (hud && panel) {
        hud.style.pointerEvents = "auto";
        hud.style.userSelect = "none";
        hud.style.webkitUserSelect = "none";
        hud.style.touchAction = "none";
        hud.style.cursor = "grab";
        hud.style.webkitTapHighlightColor = "transparent";

        hud.style.padding = "7px 9px";
        hud.style.gap = "4px";
        hud.style.borderRadius = "11px";
        hud.style.background = "rgba(0,0,0,.88)";
        hud.style.border = "1px solid rgba(255,255,255,.20)";
        hud.style.backdropFilter = "blur(10px)";
        hud.style.webkitBackdropFilter = "blur(10px)";

        const timer = doc.getElementById("readerTimer");
        const percent = doc.getElementById("readerPercent");
        const progress = doc.getElementById("readerProgress");

        if (timer) timer.style.fontSize = "15px";
        if (percent) {
            percent.style.fontSize = "9px";
            percent.style.letterSpacing = "0.5px";
        }
        if (progress) {
            progress.style.width = "82px";
            progress.style.height = "2px";
        }

        let dragging = false;
        let pointerId = null;
        let offsetX = 0;
        let offsetY = 0;

        function beginDrag(e) {
            e.preventDefault();
            e.stopPropagation();

            const r = hud.getBoundingClientRect();
            const p = panel.getBoundingClientRect();

            dragging = true;
            pointerId = e.pointerId;

            offsetX = e.clientX - r.left;
            offsetY = e.clientY - r.top;

            hud.style.left = (r.left - p.left) + "px";
            hud.style.top = (r.top - p.top) + "px";
            hud.style.right = "auto";
            hud.style.bottom = "auto";

            hud.style.cursor = "grabbing";
            hud.style.boxShadow = "0 0 18px rgba(255,255,255,.16)";

            try { hud.setPointerCapture(e.pointerId); } catch (_) {}
        }

        function moveDrag(e) {
            if (!dragging || e.pointerId !== pointerId) return;

            e.preventDefault();
            e.stopPropagation();

            const p = panel.getBoundingClientRect();
            const r = hud.getBoundingClientRect();
            const pad = 8;

            let left = e.clientX - p.left - offsetX;
            let top = e.clientY - p.top - offsetY;

            const maxLeft = Math.max(pad, p.width - r.width - pad);
            const maxTop = Math.max(pad, p.height - r.height - pad);

            left = Math.max(pad, Math.min(maxLeft, left));
            top = Math.max(pad, Math.min(maxTop, top));

            hud.style.left = left + "px";
            hud.style.top = top + "px";
        }

        function endDrag(e) {
            if (!dragging) return;
            if (e && e.pointerId !== pointerId) return;

            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            dragging = false;
            hud.style.cursor = "grab";
            hud.style.boxShadow = "";

            try { hud.releasePointerCapture(pointerId); } catch (_) {}
            pointerId = null;
        }

        hud.addEventListener("pointerdown", beginDrag, {passive:false});
        hud.addEventListener("pointermove", moveDrag, {passive:false});
        hud.addEventListener("pointerup", endDrag, {passive:false});
        hud.addEventListener("pointercancel", endDrag, {passive:false});

        win.addEventListener("pointermove", moveDrag, {passive:false});
        win.addEventListener("pointerup", endDrag, {passive:false});
        win.addEventListener("pointercancel", endDrag, {passive:false});

        function keepInside() {
            if (!hud.style.left) return;

            const p = panel.getBoundingClientRect();
            const r = hud.getBoundingClientRect();
            const pad = 8;

            let left = parseFloat(hud.style.left);
            let top = parseFloat(hud.style.top);

            if (!Number.isFinite(left)) left = pad;
            if (!Number.isFinite(top)) top = pad;

            const maxLeft = Math.max(pad, p.width - r.width - pad);
            const maxTop = Math.max(pad, p.height - r.height - pad);

            hud.style.left = Math.max(pad, Math.min(maxLeft, left)) + "px";
            hud.style.top = Math.max(pad, Math.min(maxTop, top)) + "px";
        }

        win.addEventListener("resize", keepInside);
    }

    /*
    ==================================================
    DIRECTIONAL DOUBLE-TAP
    ==================================================

    Injected into the V14 document itself so it can
    safely access V14's internal let/const state.
    */

    const experiment = doc.createElement("script");

    experiment.textContent = `
        (() => {
            let directionalLastTap = 0;
            let directionalLastOne = null;

            function isDirectionalGameInput(e) {
                return !(
                    e.target.closest("#reader") ||
                    e.target.closest("#prologue") ||
                    e.target.closest(".knowledge") ||
                    e.target.closest("#reset")
                );
            }

            function directionalSplit(one, tapX, tapY) {
                if (!one) return;

                let dx = tapX - one.x;
                let dy = tapY - one.y;

                const d2 = dx * dx + dy * dy;

                if (d2 < 1) {
                    dx = 1;
                    dy = 0;
                } else {
                    const d = Math.sqrt(d2);
                    dx /= d;
                    dy /= d;
                }

                const newOne = createOne(
                    one.x + dx * 45,
                    one.y + dy * 45,
                    MIN_SIZE,
                    false
                );

                newOne.targetX = newOne.x;
                newOne.targetY = newOne.y;

                selectedOne = newOne;
                growing = false;
            }

            document.addEventListener(
                "pointerdown",
                function(e) {
                    if (!isDirectionalGameInput(e)) {
                        return;
                    }

                    const now = performance.now();

                    const one =
                        findClosestOne(
                            e.clientX,
                            e.clientY
                        );

                    if (
                        one &&
                        one === directionalLastOne &&
                        now - directionalLastTap <=
                            DOUBLE_TAP_TIME
                    ) {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();

                        directionalSplit(
                            one,
                            e.clientX,
                            e.clientY
                        );

                        directionalLastTap = 0;
                        directionalLastOne = null;

                        return;
                    }

                    directionalLastTap = now;
                    directionalLastOne = one;
                },
                true
            );
        })();
    `;

    doc.documentElement.appendChild(experiment);
    experiment.remove();

    /*
    The original V14 pointerup remains active.
    It stops growth after a directional split,
    preserving the existing interaction model.
    */
});
</script>
</body>
</html>
