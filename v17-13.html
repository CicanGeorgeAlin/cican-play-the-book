<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CICAN — QUANTUM EVOLUTION</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{
  position:fixed;
  top:18px;
  left:18px;
  z-index:5;
  color:#fff;
  pointer-events:none;
  user-select:none;
  -webkit-user-select:none;
}
#brand{
  font-size:17px;
  font-weight:bold;
  letter-spacing:2px;
}
#state{
  margin-top:5px;
  font-size:9px;
  letter-spacing:1.5px;
  opacity:.55;
  text-transform:uppercase;
}
#cican-mark{
  position:fixed;
  right:18px;
  bottom:18px;
  width:42px;
  height:42px;
  z-index:20;
  pointer-events:auto;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  opacity:.86;
  cursor:grab;
  filter:drop-shadow(0 0 10px rgba(255,255,255,.24));
}
#cican-mark.dragging{
  cursor:grabbing;
  opacity:1;
  filter:drop-shadow(0 0 14px rgba(255,255,255,.38));
}
.cican-face{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#fff;
  position:relative;
}
.cican-face span{
  position:absolute;
  top:12px;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#000;
}
.cican-face span:first-child{left:9px}
.cican-face span:last-child{right:9px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="brand">CICAN</div>
  <div id="state">PARTICLE</div>
</div>

<!-- Persistent CICAN identity: always present, never evolves away. -->
<div id="cican-mark" aria-label="CICAN identity">
  <div class="cican-face">
    <span></span><span></span>
  </div>
</div>

<script>
/*
CICAN — QUANTUM EVOLUTION V17
Development branch. V16 remains untouched.

Core idea:
TWO BECOME ONE.
ONE BECOMES SOMETHING NEW.

This is a game abstraction inspired by emergence across scales.
The evolution engine gives each state its own behavior and remembers
the lineage that created it. The names and mechanics are conceptual
game models, not claims that real physics or biology works this way.
*/

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){
  W=innerWidth; H=innerHeight; DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=W*DPR; canvas.height=H*DPR;
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize); resize();

/* =================================================
   PERMANENT CICAN IDENTITY
   Always present. Movable by the player.
================================================= */

const cicanMark=document.getElementById("cican-mark");
let cicanDragging=false;
let cicanPointerId=null;
let cicanDragDX=0;
let cicanDragDY=0;

cicanMark.addEventListener("pointerdown",e=>{
  e.preventDefault();
  e.stopPropagation();

  const r=cicanMark.getBoundingClientRect();
  cicanDragging=true;
  cicanPointerId=e.pointerId;
  cicanDragDX=e.clientX-r.left;
  cicanDragDY=e.clientY-r.top;
  cicanMark.classList.add("dragging");

  try{cicanMark.setPointerCapture(e.pointerId)}catch(_){}
});

cicanMark.addEventListener("pointermove",e=>{
  if(!cicanDragging || e.pointerId!==cicanPointerId)return;

  e.preventDefault();

  const w=cicanMark.offsetWidth;
  const h=cicanMark.offsetHeight;

  const left=clamp(e.clientX-cicanDragDX,8,W-w-8);
  const top=clamp(e.clientY-cicanDragDY,8,H-h-8);

  cicanMark.style.left=left+"px";
  cicanMark.style.top=top+"px";
  cicanMark.style.right="auto";
  cicanMark.style.bottom="auto";
});

function endCicanDrag(e){
  if(!cicanDragging)return;
  if(e && cicanPointerId!==null && e.pointerId!==cicanPointerId)return;

  cicanDragging=false;
  cicanPointerId=null;
  cicanMark.classList.remove("dragging");
}

cicanMark.addEventListener("pointerup",endCicanDrag);
cicanMark.addEventListener("pointercancel",endCicanDrag);

window.addEventListener("resize",()=>{
  if(!cicanMark.style.left || !cicanMark.style.top)return;

  const w=cicanMark.offsetWidth;
  const h=cicanMark.offsetHeight;

  const left=clamp(parseFloat(cicanMark.style.left)||8,8,Math.max(8,W-w-8));
  const top=clamp(parseFloat(cicanMark.style.top)||8,8,Math.max(8,H-h-8));

  cicanMark.style.left=left+"px";
  cicanMark.style.top=top+"px";
});

/* =================================================
   V17 ENGINE
================================================= */

const MIN_SIZE=34;
const MAX_SIZE=180;
const GROWTH_STEP=.5;
const MOVE=.10;
const MERGE_DISTANCE=72;
const DOUBLE_TAP_TIME=350;
const TRAIL_DISTANCE=35;

/*
  EVOLUTION ENGINE

  Each state is more than a label:
  - kind controls how it is represented
  - behavior controls how it moves
  - complexity describes the game model
  - phase marks the conceptual domain

  These are deliberately simplified game abstractions.
*/
const STATES=[
  {name:"CICAN PARTICLE", short:"PARTICLE", level:1, kind:"particle", behavior:"direct", complexity:1, phase:"matter"},
  {name:"QUANTUM STATE", short:"QUANTUM", level:2, kind:"quantum", behavior:"uncertain", complexity:2, phase:"matter"},
  {name:"NUCLEUS", short:"NUCLEUS", level:3, kind:"nucleus", behavior:"bound", complexity:3, phase:"matter"},
  {name:"ATOM", short:"ATOM", level:4, kind:"atom", behavior:"orbit", complexity:4, phase:"matter"},
  {name:"MOLECULE", short:"MOLECULE", level:5, kind:"molecule", behavior:"connected", complexity:5, phase:"chemistry"},
  {name:"COMPLEX MOLECULE", short:"COMPLEX", level:6, kind:"complex", behavior:"connected", complexity:6, phase:"chemistry"},
  {name:"MOLECULAR LATTICE", short:"LATTICE", level:7, kind:"lattice", behavior:"ordered", complexity:7, phase:"chemistry"},
  {name:"ORGANIC STRUCTURE", short:"ORGANIC", level:8, kind:"organic", behavior:"organic", complexity:8, phase:"chemistry"},
  {name:"DNA", short:"DNA", level:9, kind:"dna", behavior:"encoded", complexity:9, phase:"life"},
  {name:"GENOME", short:"GENOME", level:10, kind:"genome", behavior:"encoded", complexity:10, phase:"life"},
  {name:"CELL", short:"CELL", level:11, kind:"cell", behavior:"contained", complexity:11, phase:"life"},
  {name:"MULTICELLULAR LIFE", short:"MULTICELLULAR", level:12, kind:"life", behavior:"living", complexity:12, phase:"life"},
  {name:"LIVING ORGANISM", short:"ORGANISM", level:13, kind:"life", behavior:"living", complexity:13, phase:"life"},
  {name:"HUMAN", short:"HUMAN", level:14, kind:"human", behavior:"intentional", complexity:14, phase:"humanity"},
  {name:"HUMAN GROUP", short:"GROUP", level:15, kind:"human", behavior:"social", complexity:15, phase:"humanity"},
  {name:"SOCIETY", short:"SOCIETY", level:16, kind:"human", behavior:"social", complexity:16, phase:"humanity"},
  {name:"CIVILIZATION", short:"CIVILIZATION", level:17, kind:"human", behavior:"systemic", complexity:17, phase:"humanity"},
  {name:"PLANETARY SYSTEM", short:"PLANETARY", level:18, kind:"planet", behavior:"orbital", complexity:18, phase:"cosmos"},
  {name:"STAR", short:"STAR", level:19, kind:"star", behavior:"radiant", complexity:19, phase:"cosmos"},
  {name:"STELLAR SYSTEM", short:"STELLAR", level:20, kind:"star", behavior:"orbital", complexity:20, phase:"cosmos"},
  {name:"GALAXY", short:"GALAXY", level:21, kind:"galaxy", behavior:"spiral", complexity:21, phase:"cosmos"},
  {name:"GALAXY NETWORK", short:"NETWORK", level:22, kind:"galaxy", behavior:"networked", complexity:22, phase:"cosmos"},
  {name:"COSMIC STRUCTURE", short:"COSMIC", level:23, kind:"cosmic", behavior:"vast", complexity:23, phase:"cosmos"},
  {name:"EMERGENCE", short:"EMERGENCE", level:24, kind:"cosmic", behavior:"emergent", complexity:24, phase:"emergence"},
  {name:"NEW POSSIBILITY", short:"POSSIBILITY", level:25, kind:"cosmic", behavior:"emergent", complexity:25, phase:"emergence"}
];

// Level 26 is intentionally not another scale.
// It is the return of the identity: CICAN.
// Two Level-26 CICANs merge to restart the journey at Level 1.


let discovered=new Set([1]);
let ones=[];
let trails=[];
let lastTap=0;
let pointer={x:W/2,y:H/2,down:false,id:null};
let nextId=1;
let lastTime=performance.now();

function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
const LOOP_CICAN_LEVEL = STATES.length + 1;
const LOOP_LABEL = "CICAN";
const ORIGIN_LEVEL = 1;

function stateFor(level){
  if(level<=STATES.length) return STATES[level-1];

  // The journey closes the circle instead of growing forever.
  // EMERGENCE -> SYSTEM -> CICAN. Two CICANs then restart at PARTICLE.
  return {
    name:LOOP_LABEL,
    short:LOOP_LABEL,
    level:LOOP_CICAN_LEVEL,
    kind:"particle",
    behavior:"origin",
    complexity:1,
    phase:"origin"
  };
}

function makeOne(x,y,level=1,size=MIN_SIZE,history=null){
  const state=stateFor(level);
  return {
    id:nextId++,
    x,y,targetX:x,targetY:y,size,level,
    lastTrailX:x,lastTrailY:y,
    phase:Math.random()*Math.PI*2,
    born:performance.now(),
    pulse:0,
    mergeLockUntil:0,
    history:history || [level],
    ancestryCount:history ? Math.max(1, history.length) : 1,
    behavior:state.behavior,
    complexity:state.complexity,
    phaseType:state.phase,
    orbitAngle:Math.random()*Math.PI*2,
    orbitRadius:rand(.15,.45),
    wobble:rand(.7,1.3)
  };
}

ones.push(makeOne(W/2,H/2,1,MIN_SIZE));

function setStateUI(level){
  const s=stateFor(level);
  document.getElementById("state").textContent=s.short;
}

/*
  Future-facing discovery data.
  Nothing extra is shown to the player yet.
  Other CICAN systems can eventually read this without changing
  the core interaction.
*/
function getEvolutionData(one){
  const s=stateFor(one.level);
  return {
    level:one.level,
    name:s.name,
    phase:s.phase,
    behavior:s.behavior,
    complexity:s.complexity,
    history:one.history.slice()
  };
}
function grow(o){
  o.size=clamp(o.size+GROWTH_STEP,MIN_SIZE,MAX_SIZE);
}

function split(o){
  // Splitting creates another instance of the same state.
  // Both carry the lineage of what already emerged.
  const newSize=Math.max(MIN_SIZE,Math.min(o.size,MAX_SIZE));

  const offset=140;
  const direction=o.x<W/2 ? 1 : -1;
  const spawnX=clamp(o.x+offset*direction,40,W-40);

  const inheritedHistory=o.history.slice();
  const a=makeOne(spawnX,o.y,o.level,newSize,inheritedHistory);
  a.ancestryCount=o.ancestryCount || inheritedHistory.length;
  a.targetX=spawnX;
  a.targetY=o.y;
  a.mergeLockUntil=performance.now()+650;

  o.mergeLockUntil=performance.now()+350;
  ones.push(a);
}
function tryMerge(){
  const now=performance.now();

  for(let i=0;i<ones.length;i++){
    for(let j=i+1;j<ones.length;j++){
      const a=ones[i],b=ones[j];

      // Two different states never merge.
      if(a.level!==b.level) continue;

      // Give freshly split CICANs a short moment to separate.
      if((a.mergeLockUntil||0)>now || (b.mergeLockUntil||0)>now) continue;

      const dx=b.x-a.x;
      const dy=b.y-a.y;
      const d=Math.hypot(dx,dy);

      // Same-state CICANs begin gently attracting one another.
      // This makes mobile control much more forgiving.
      const attractRange=180;

      if(d>0 && d<attractRange){
        const pull=(1-d/attractRange)*0.045;
        a.targetX+=dx*pull;
        a.targetY+=dy*pull;
        b.targetX-=dx*pull;
        b.targetY-=dy*pull;
      }

      // Merge when the two CICANs are genuinely close.
      const reach=Math.max(
        MERGE_DISTANCE,
        (a.size+b.size)*0.5
      );

      if(d<=reach){
        const reachedLoopCican =
          a.level===LOOP_CICAN_LEVEL && b.level===LOOP_CICAN_LEVEL;

        // Closed-loop evolution:
        // EMERGENCE -> SYSTEM -> CICAN.
        // Two final CICAN forms return the player to the first particle.
        const level = reachedLoopCican ? ORIGIN_LEVEL : a.level+1;

        const size=clamp(
          Math.sqrt(a.size*a.size+b.size*b.size),
          MIN_SIZE,
          MAX_SIZE
        );

        // Keep lineage bounded. A completed circle starts a fresh cycle.
        const MAX_HISTORY=128;
        const combinedHistory=a.history.concat(b.history);
        combinedHistory.push(level);
        const inheritedHistory=reachedLoopCican
          ? [ORIGIN_LEVEL]
          : combinedHistory.slice(-MAX_HISTORY);

        const n=makeOne(
          (a.x+b.x)/2,
          (a.y+b.y)/2,
          level,
          reachedLoopCican ? MIN_SIZE : size,
          inheritedHistory
        );

        n.targetX=n.x;
        n.targetY=n.y;
        n.mergeLockUntil=now+500;
        n.evolveFlash=1;

        ones.splice(j,1);
        ones.splice(i,1);
        ones.push(n);

        discovered.add(level);
        setStateUI(level);

        // Completing the circle is an evolution too:
        // the complex journey returns to the CICAN origin.
        n.evolveFlash=reachedLoopCican ? 1.6 : 1;

        // Evolution pulse.
        n.evolveFlash=reachedLoopCican ? 1.6 : 1;
        trails.push({
          x:n.x,
          y:n.y,
          life:1.5,
          level
        });

        const pulseDots = reachedLoopCican ? 10 : 18;
        for(let k=0;k<pulseDots;k++){
          const ang=Math.random()*Math.PI*2;
          const rr=rand(14,52);
          trails.push({
            x:n.x+Math.cos(ang)*rr,
            y:n.y+Math.sin(ang)*rr,
            life:1.2,
            level
          });
        }

        return true;
      }
    }
  }

  return false;
}

function setTarget(x,y){
  pointer.x=x;pointer.y=y;
  let nearest=null,best=Infinity;
  for(const o of ones){
    const d=Math.hypot(x-o.x,y-o.y);
    if(d<best){best=d;nearest=o}
  }
  if(nearest){
    nearest.targetX=x; nearest.targetY=y;
  }
}

function drawGlow(x,y,r,alpha=.18){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(255,255,255,${alpha})`);
  g.addColorStop(.35,`rgba(255,255,255,${alpha*.32})`);
  g.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}

function drawOne(o,t){
  const s=stateFor(o.level);
  const pulse=1+Math.sin(t*.003+o.phase)*.025;
  const evolutionScale=1+Math.min(o.level-1,12)*.018;
  const flash=1+(o.evolveFlash||0)*.12;
  const r=o.size*.5*pulse*evolutionScale*flash;

  const isLoopCican = o.level===LOOP_CICAN_LEVEL;
  drawGlow(o.x,o.y,r*(isLoopCican?2.8:2.2),isLoopCican?.22:.15);

  ctx.save();
  ctx.translate(o.x,o.y);

  if(s.kind==="particle"){
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#000";ctx.beginPath();ctx.arc(-r*.22,-r*.08,r*.09,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(r*.22,-r*.08,r*.09,0,Math.PI*2);ctx.fill();
  }else if(s.kind==="quantum"){
    ctx.strokeStyle="#fff";ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,0,r*.28,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.45)";
    ctx.beginPath();ctx.ellipse(0,0,r*1.25,r*.45,Math.sin(t*.001+o.phase),0,Math.PI*2);ctx.stroke();
  }else if(s.kind==="nucleus"){
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,0,r*.42,0,Math.PI*2);ctx.fill();
    for(let k=0;k<4;k++){
      const a=t*.0007+o.phase+k*Math.PI/2;
      ctx.fillStyle="rgba(255,255,255,.8)";
      ctx.beginPath();ctx.arc(Math.cos(a)*r*.65,Math.sin(a)*r*.65,r*.11,0,Math.PI*2);ctx.fill();
    }
  }else if(s.kind==="atom"){
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,0,r*.28,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.75)";
    for(let k=0;k<2;k++){
      ctx.beginPath();ctx.ellipse(0,0,r*(.8+k*.2),r*(.3+k*.12),k*Math.PI/3+t*.0003,0,Math.PI*2);ctx.stroke();
    }
  }else if(s.kind==="molecule"||s.kind==="complex"){
    const n=s.kind==="molecule"?4:7;
    const pts=[];
    for(let k=0;k<n;k++){
      const a=k*Math.PI*2/n+t*.00025+o.phase;
      pts.push([Math.cos(a)*r*.58,Math.sin(a)*r*.58]);
    }
    ctx.strokeStyle="rgba(255,255,255,.7)";ctx.lineWidth=2;
    for(let k=0;k<n;k++){ctx.beginPath();ctx.moveTo(pts[k][0],pts[k][1]);ctx.lineTo(pts[(k+1)%n][0],pts[(k+1)%n][1]);ctx.stroke()}
    ctx.fillStyle="#fff";for(const p of pts){ctx.beginPath();ctx.arc(p[0],p[1],r*.14,0,Math.PI*2);ctx.fill()}
    ctx.beginPath();ctx.arc(0,0,r*.18,0,Math.PI*2);ctx.fill();
  }else if(s.kind==="lattice"){
    ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=1;
    const step=r*.38;
    for(let x=-r;x<=r;x+=step)for(let y=-r;y<=r;y+=step){
      if(x*x+y*y<r*r){ctx.beginPath();ctx.arc(x,y,r*.055,0,Math.PI*2);ctx.stroke()}
    }
  }else if(s.kind==="organic"){
    ctx.strokeStyle="rgba(255,255,255,.72)";ctx.lineWidth=2;ctx.beginPath();
    for(let k=0;k<=12;k++){const a=k/12*Math.PI*2;const rr=r*(.55+.12*Math.sin(k*2.1));const x=Math.cos(a)*rr,y=Math.sin(a)*rr;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.closePath();ctx.stroke();
  }else if(s.kind==="dna"||s.kind==="genome"){
    ctx.strokeStyle="#fff";ctx.lineWidth=2;
    ctx.beginPath();
    for(let k=0;k<=24;k++){const y=-r*.75+k/24*r*1.5;const x=Math.sin(k*.75+t*.001)*r*.42;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
    ctx.beginPath();
    for(let k=0;k<=24;k++){const y=-r*.75+k/24*r*1.5;const x=-Math.sin(k*.75+t*.001)*r*.42;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
    for(let k=3;k<22;k+=3){const y=-r*.75+k/24*r*1.5;const x=Math.sin(k*.75+t*.001)*r*.42;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(-x,y);ctx.stroke()}
  }else if(s.kind==="cell"){
    ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r*.82,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.14)";ctx.beginPath();ctx.arc(0,0,r*.78,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,0,r*.2,0,Math.PI*2);ctx.fill();
  }else if(s.kind==="life"){
    ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();
    for(let k=0;k<18;k++){const a=k/18*Math.PI*2;const rr=r*(.6+.18*Math.sin(k*3.7));const x=Math.cos(a)*rr,y=Math.sin(a)*rr;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,0,r*.18,0,Math.PI*2);ctx.fill();
  }else if(s.kind==="planet"){
    ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r*.68,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle="rgba(255,255,255,.45)";ctx.beginPath();ctx.ellipse(0,0,r*1.05,r*.25,-.2,0,Math.PI*2);ctx.stroke();
  }else if(s.kind==="star"){
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,0,r*.28,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.72)";ctx.lineWidth=2;
    for(let k=0;k<8;k++){const a=k*Math.PI/4;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.35,Math.sin(a)*r*.35);ctx.lineTo(Math.cos(a)*r*.92,Math.sin(a)*r*.92);ctx.stroke()}
  }else if(s.kind==="galaxy"){
    ctx.strokeStyle="rgba(255,255,255,.72)";ctx.lineWidth=1.5;
    for(let k=0;k<4;k++){ctx.beginPath();for(let q=0;q<45;q++){const a=q*.32+k*.7;const rr=r*.04+q/45*r*.85;const x=Math.cos(a)*rr,y=Math.sin(a)*rr*.55;q?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,0,r*.12,0,Math.PI*2);ctx.fill();
  }else if(s.kind==="cosmic"){
    ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=1;
    for(let k=0;k<24;k++){const a=k*.618;const rr=(k/24)*r*.9;ctx.beginPath();ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,r*.025,0,Math.PI*2);ctx.stroke()}
  }else{
    // HUMAN: deliberately symbolic, not anatomically literal.
    ctx.strokeStyle="#fff";ctx.lineWidth=Math.max(2,r*.035);
    ctx.beginPath();ctx.arc(0,-r*.42,r*.18,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-r*.24);ctx.lineTo(0,r*.42);
    ctx.moveTo(-r*.35,0);ctx.lineTo(r*.35,0);
    ctx.moveTo(0,r*.42);ctx.lineTo(-r*.28,r*.78);
    ctx.moveTo(0,r*.42);ctx.lineTo(r*.28,r*.78);ctx.stroke();
  }

  ctx.restore();
}

function update(dt,t){
  for(const o of ones){
    const s=stateFor(o.level);
    let tx=o.targetX;
    let ty=o.targetY;

    /*
      Evolution changes behavior gradually.
      The player's basic control remains the same:
      point CICAN where you want it to go.
    */
    if(s.behavior==="uncertain"){
      tx += Math.sin(t*.0021+o.phase)*o.size*.16;
      ty += Math.cos(t*.0017+o.phase*1.7)*o.size*.16;
    }else if(s.behavior==="bound"){
      tx += Math.sin(t*.0012+o.phase)*o.size*.05;
      ty += Math.cos(t*.0014+o.phase)*o.size*.05;
    }else if(s.behavior==="orbit" || s.behavior==="orbital"){
      o.orbitAngle += dt*.00055;
      const rr=Math.max(8,o.size*o.orbitRadius);
      tx += Math.cos(o.orbitAngle)*rr;
      ty += Math.sin(o.orbitAngle)*rr;
    }else if(s.behavior==="connected"){
      tx += Math.cos(t*.001+o.phase)*o.size*.035;
      ty += Math.sin(t*.0012+o.phase)*o.size*.035;
    }else if(s.behavior==="ordered"){
      const grid=o.size*.18;
      tx += Math.sin(t*.0007+o.phase)*grid;
      ty += Math.cos(t*.0007+o.phase)*grid;
    }else if(s.behavior==="organic" || s.behavior==="living"){
      tx += Math.sin(t*.0011+o.phase)*o.size*.08*o.wobble;
      ty += Math.cos(t*.0009+o.phase*1.4)*o.size*.07*o.wobble;
    }else if(s.behavior==="encoded"){
      tx += Math.sin(t*.0022+o.phase)*o.size*.045;
      ty += Math.sin(t*.0031+o.phase*.7)*o.size*.045;
    }else if(s.behavior==="contained"){
      tx += Math.cos(t*.001+o.phase)*o.size*.035;
      ty += Math.sin(t*.001+o.phase)*o.size*.035;
    }else if(s.behavior==="intentional"){
      tx += Math.sin(t*.0008+o.phase)*o.size*.025;
      ty += Math.cos(t*.0008+o.phase)*o.size*.025;
    }else if(s.behavior==="social" || s.behavior==="systemic" || s.behavior==="networked"){
      tx += Math.sin(t*.00065+o.phase)*o.size*.055;
      ty += Math.cos(t*.0008+o.phase*1.2)*o.size*.055;
    }else if(s.behavior==="radiant"){
      tx += Math.sin(t*.0015+o.phase)*o.size*.025;
      ty += Math.cos(t*.0015+o.phase)*o.size*.025;
    }else if(s.behavior==="spiral" || s.behavior==="vast"){
      tx += Math.cos(t*.0005+o.phase)*o.size*.07;
      ty += Math.sin(t*.0005+o.phase)*o.size*.07;
    }else if(s.behavior==="emergent"){
      tx += Math.sin(t*.0013+o.phase)*o.size*.12;
      ty += Math.cos(t*.0011+o.phase*1.9)*o.size*.10;
    }else if(s.behavior==="origin"){
      // CICAN is the return point: calm, centered, alive.
      tx += Math.sin(t*.0009+o.phase)*o.size*.035;
      ty += Math.cos(t*.0011+o.phase)*o.size*.035;
    }

    o.x+=(tx-o.x)*MOVE;
    o.y+=(ty-o.y)*MOVE;

    const dist=Math.hypot(o.x-o.lastTrailX,o.y-o.lastTrailY);
    if(dist>=TRAIL_DISTANCE){
      trails.push({x:o.x,y:o.y,life:1,level:o.level});
      o.lastTrailX=o.x;o.lastTrailY=o.y;
    }
    o.pulse=Math.max(0,o.pulse-dt*.003);
    o.evolveFlash=Math.max(0,(o.evolveFlash||0)-dt/700);
  }

  for(const tr of trails) tr.life-=dt/1500;
  trails=trails.filter(t=>t.life>0);
  tryMerge();
}

function draw(t){
  ctx.clearRect(0,0,W,H);

  for(const tr of trails){
    ctx.globalAlpha=Math.max(0,tr.life)*.24;
    const r=2+tr.level*.15;
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(tr.x,tr.y,r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  for(const o of ones) drawOne(o,t);


}

function loop(t){
  const dt=Math.min(40,t-lastTime);lastTime=t;
  update(dt,t);draw(t);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

canvas.addEventListener("pointerdown",e=>{
  pointer.down=true;pointer.id=e.pointerId;
  try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  const now=performance.now();
  if(now-lastTap<DOUBLE_TAP_TIME){
    let nearest=null,best=Infinity;
    for(const o of ones){const d=Math.hypot(e.clientX-o.x,e.clientY-o.y);if(d<best){best=d;nearest=o}}
    if(nearest) split(nearest);
  }
  lastTap=now;
  setTarget(e.clientX,e.clientY);
});

canvas.addEventListener("pointermove",e=>{
  if(!pointer.down)return;
  setTarget(e.clientX,e.clientY);
});

canvas.addEventListener("pointerup",e=>{
  pointer.down=false;
  if(pointer.id===e.pointerId)pointer.id=null;
});

canvas.addEventListener("pointercancel",()=>{pointer.down=false;pointer.id=null});

setInterval(()=>{
  if(pointer.down){
    let nearest=null,best=Infinity;
    for(const o of ones){const d=Math.hypot(pointer.x-o.x,pointer.y-o.y);if(d<best){best=d;nearest=o}}
    if(nearest)grow(nearest);
  }
},30);

document.addEventListener("visibilitychange",()=>{
  if(!document.hidden)lastTime=performance.now();
});
</script>
</body>
</html>
