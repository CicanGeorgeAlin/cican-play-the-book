<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CICAN — PLAY THE BOOK V14 Small Timer Test</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
iframe{width:100%;height:100%;border:0;display:block;background:#000}
</style>
</head>
<body>
<iframe id="v14Frame" src="v14.html" title="CICAN — PLAY THE BOOK V14"></iframe>

<script>
/*
==================================================
CICAN — PLAY THE BOOK
V14 SMALL TIMER TEST

SAFE TEST COPY:
- v14.html is loaded unchanged.
- Original V14 reader remains untouched.
- Original PAUSE/RESUME remains untouched.
- Original reader UI remains untouched.
- Only the existing timer and percentage are made
  small and movable.
- No new reader engine is added.
==================================================
*/

const frame = document.getElementById("v14Frame");

frame.addEventListener("load", function () {

    const win = frame.contentWindow;
    const doc = frame.contentDocument;

    if (!win || !doc) return;

    const hud = doc.getElementById("readerHUD");
    const panel = doc.querySelector(".reader-panel");
    const timer = doc.getElementById("readerTimer");
    const percent = doc.getElementById("readerPercent");

    if (!hud || !panel || !timer || !percent) return;

    /*
    ================================================
    ONLY CHANGE THE TIMER/PERCENTAGE HUD
    ================================================
    */

    hud.style.position = "absolute";
    hud.style.width = "auto";
    hud.style.minWidth = "58px";
    hud.style.padding = "5px 7px";
    hud.style.gap = "2px";
    hud.style.borderRadius = "8px";
    hud.style.background = "rgba(0,0,0,0.72)";
    hud.style.border = "1px solid rgba(255,255,255,0.14)";
    hud.style.boxShadow = "0 4px 14px rgba(0,0,0,0.35)";
    hud.style.backdropFilter = "blur(5px)";
    hud.style.webkitBackdropFilter = "blur(5px)";
    hud.style.pointerEvents = "auto";
    hud.style.touchAction = "none";
    hud.style.userSelect = "none";
    hud.style.webkitUserSelect = "none";
    hud.style.cursor = "grab";
    hud.style.webkitTapHighlightColor = "transparent";

    timer.style.fontSize = "12px";
    timer.style.lineHeight = "1";
    timer.style.margin = "0";
    timer.style.whiteSpace = "nowrap";

    percent.style.fontSize = "8px";
    percent.style.lineHeight = "1";
    percent.style.opacity = "0.5";
    percent.style.margin = "0";
    percent.style.whiteSpace = "nowrap";

    /*
    Hide only the old progress line if V14 has one.
    The original reader and its auto-scroll are untouched.
    */

    const progress = doc.getElementById("readerProgress");
    if (progress) {
        progress.style.display = "none";
    }

    /*
    ================================================
    DRAG STATE
    ================================================
    */

    let dragging = false;
    let pointerId = null;
    let offsetX = 0;
    let offsetY = 0;

    function beginDrag(e) {

        e.preventDefault();
        e.stopPropagation();

        const r = hud.getBoundingClientRect();
        const p = panel.getBoundingClientRect();

        dragging = true;
        pointerId = e.pointerId;

        offsetX = e.clientX - r.left;
        offsetY = e.clientY - r.top;

        hud.style.left = (r.left - p.left) + "px";
        hud.style.top = (r.top - p.top) + "px";
        hud.style.right = "auto";
        hud.style.bottom = "auto";

        hud.style.cursor = "grabbing";

        try {
            hud.setPointerCapture(e.pointerId);
        } catch (_) {}
    }

    function moveDrag(e) {

        if (!dragging || e.pointerId !== pointerId) return;

        e.preventDefault();
        e.stopPropagation();

        const p = panel.getBoundingClientRect();
        const r = hud.getBoundingClientRect();

        const padding = 6;

        let left =
            e.clientX -
            p.left -
            offsetX;

        let top =
            e.clientY -
            p.top -
            offsetY;

        const maxLeft =
            Math.max(
                padding,
                p.width - r.width - padding
            );

        const maxTop =
            Math.max(
                padding,
                p.height - r.height - padding
            );

        left =
            Math.max(
                padding,
                Math.min(maxLeft, left)
            );

        top =
            Math.max(
                padding,
                Math.min(maxTop, top)
            );

        hud.style.left = left + "px";
        hud.style.top = top + "px";
    }

    function endDrag(e) {

        if (!dragging) return;

        if (
            e &&
            e.pointerId !== pointerId
        ) return;

        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        dragging = false;
        hud.style.cursor = "grab";

        try {
            hud.releasePointerCapture(pointerId);
        } catch (_) {}

        pointerId = null;
    }

    hud.addEventListener(
        "pointerdown",
        beginDrag,
        { passive: false }
    );

    hud.addEventListener(
        "pointermove",
        moveDrag,
        { passive: false }
    );

    hud.addEventListener(
        "pointerup",
        endDrag,
        { passive: false }
    );

    hud.addEventListener(
        "pointercancel",
        endDrag,
        { passive: false }
    );

    /*
    Prevent dragging the HUD from becoming a reader/game touch.
    */

    hud.addEventListener(
        "click",
        function(e) {
            e.preventDefault();
            e.stopPropagation();
        },
        { passive: false }
    );

    /*
    Keep the small HUD inside the reader after rotation/resize.
    */

    win.addEventListener("resize", function () {

        if (!hud.style.left) return;

        const p = panel.getBoundingClientRect();
        const r = hud.getBoundingClientRect();
        const padding = 6;

        let left = parseFloat(hud.style.left);
        let top = parseFloat(hud.style.top);

        if (!Number.isFinite(left)) left = padding;
        if (!Number.isFinite(top)) top = padding;

        const maxLeft =
            Math.max(
                padding,
                p.width - r.width - padding
            );

        const maxTop =
            Math.max(
                padding,
                p.height - r.height - padding
            );

        left =
            Math.max(
                padding,
                Math.min(maxLeft, left)
            );

        top =
            Math.max(
                padding,
                Math.min(maxTop, top)
            );

        hud.style.left = left + "px";
        hud.style.top = top + "px";
    });

});
</script>
</body>
</html>
