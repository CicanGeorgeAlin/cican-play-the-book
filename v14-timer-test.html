<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">
<title>CICAN — PLAY THE BOOK V14 TIMER TEST</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
    }
</style>
</head>

<body>

<iframe
    id="v14Frame"
    src="v14.html"
    title="CICAN — PLAY THE BOOK V14">
</iframe>

<script>
/*
==================================================
CICAN — PLAY THE BOOK
V14 TIMER TEST

IMPORTANT:
This file does NOT modify v14.html.

It loads the locked V14 page and adds the
experimental draggable timer/progress HUD from
outside the master file.

If this test is rejected or deleted, V14 remains
untouched.
==================================================
*/

const frame =
    document.getElementById("v14Frame");

frame.addEventListener(
    "load",
    function() {

        const win =
            frame.contentWindow;

        const doc =
            frame.contentDocument;

        if (!doc) {
            return;
        }

        const hud =
            doc.getElementById("readerHUD");

        const panel =
            doc.querySelector(".reader-panel");

        if (!hud || !panel) {
            return;
        }

        /*
        ------------------------------------------
        HUD VISUAL / TOUCH BEHAVIOR
        ------------------------------------------
        */

        hud.style.pointerEvents = "auto";
        hud.style.userSelect = "none";
        hud.style.webkitUserSelect = "none";
        hud.style.touchAction = "none";
        hud.style.cursor = "grab";
        hud.style.webkitTapHighlightColor =
            "transparent";

        /*
        ------------------------------------------
        DRAG STATE
        ------------------------------------------
        */

        let dragging = false;
        let pointerId = null;

        let offsetX = 0;
        let offsetY = 0;

        /*
        ------------------------------------------
        START DRAG
        ------------------------------------------
        */

        hud.addEventListener(
            "pointerdown",
            function(e) {

                e.preventDefault();
                e.stopPropagation();

                const hudRect =
                    hud.getBoundingClientRect();

                const panelRect =
                    panel.getBoundingClientRect();

                dragging = true;
                pointerId = e.pointerId;

                offsetX =
                    e.clientX -
                    hudRect.left;

                offsetY =
                    e.clientY -
                    hudRect.top;

                /*
                Convert the original right/bottom
                position into left/top coordinates.
                */

                hud.style.left =
                    (
                        hudRect.left -
                        panelRect.left
                    ) + "px";

                hud.style.top =
                    (
                        hudRect.top -
                        panelRect.top
                    ) + "px";

                hud.style.right =
                    "auto";

                hud.style.bottom =
                    "auto";

                hud.style.cursor =
                    "grabbing";

                hud.style.boxShadow =
                    "0 0 18px rgba(255,255,255,0.18)";

                try {
                    hud.setPointerCapture(
                        e.pointerId
                    );
                } catch (_) {}
            },
            { passive: false }
        );

        /*
        ------------------------------------------
        MOVE DRAG
        ------------------------------------------
        */

        function moveHUD(e) {

            if (!dragging) {
                return;
            }

            if (
                e.pointerId !== pointerId
            ) {
                return;
            }

            e.preventDefault();
            e.stopPropagation();

            const panelRect =
                panel.getBoundingClientRect();

            const hudRect =
                hud.getBoundingClientRect();

            const padding = 8;

            let left =
                e.clientX -
                panelRect.left -
                offsetX;

            let top =
                e.clientY -
                panelRect.top -
                offsetY;

            const maxLeft =
                Math.max(
                    padding,
                    panelRect.width -
                    hudRect.width -
                    padding
                );

            const maxTop =
                Math.max(
                    padding,
                    panelRect.height -
                    hudRect.height -
                    padding
                );

            left =
                Math.max(
                    padding,
                    Math.min(
                        maxLeft,
                        left
                    )
                );

            top =
                Math.max(
                    padding,
                    Math.min(
                        maxTop,
                        top
                    )
                );

            hud.style.left =
                left + "px";

            hud.style.top =
                top + "px";
        }

        /*
        ------------------------------------------
        END DRAG
        ------------------------------------------
        */

        function endHUDDrag(e) {

            if (!dragging) {
                return;
            }

            if (
                e &&
                e.pointerId !== pointerId
            ) {
                return;
            }

            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            dragging = false;

            hud.style.cursor =
                "grab";

            hud.style.boxShadow =
                "";

            try {
                hud.releasePointerCapture(
                    pointerId
                );
            } catch (_) {}

            pointerId = null;
        }

        /*
        Pointer capture is used first.
        Window listeners are the safety net.
        */

        hud.addEventListener(
            "pointermove",
            moveHUD,
            { passive: false }
        );

        hud.addEventListener(
            "pointerup",
            endHUDDrag,
            { passive: false }
        );

        hud.addEventListener(
            "pointercancel",
            endHUDDrag,
            { passive: false }
        );

        win.addEventListener(
            "pointermove",
            moveHUD,
            { passive: false }
        );

        win.addEventListener(
            "pointerup",
            endHUDDrag,
            { passive: false }
        );

        win.addEventListener(
            "pointercancel",
            endHUDDrag,
            { passive: false }
        );

        /*
        ------------------------------------------
        KEEP HUD INSIDE PANEL AFTER RESIZE
        ------------------------------------------
        */

        function keepHUDInsidePanel() {

            if (!hud.style.left) {
                return;
            }

            const panelRect =
                panel.getBoundingClientRect();

            const hudRect =
                hud.getBoundingClientRect();

            const padding = 8;

            const maxLeft =
                Math.max(
                    padding,
                    panelRect.width -
                    hudRect.width -
                    padding
                );

            const maxTop =
                Math.max(
                    padding,
                    panelRect.height -
                    hudRect.height -
                    padding
                );

            let left =
                parseFloat(
                    hud.style.left
                );

            let top =
                parseFloat(
                    hud.style.top
                );

            if (!Number.isFinite(left)) {
                left = padding;
            }

            if (!Number.isFinite(top)) {
                top = padding;
            }

            left =
                Math.max(
                    padding,
                    Math.min(
                        maxLeft,
                        left
                    )
                );

            top =
                Math.max(
                    padding,
                    Math.min(
                        maxTop,
                        top
                    )
                );

            hud.style.left =
                left + "px";

            hud.style.top =
                top + "px";
        }

        win.addEventListener(
            "resize",
            keepHUDInsidePanel
        );
    }
);
</script>

</body>
</html>
