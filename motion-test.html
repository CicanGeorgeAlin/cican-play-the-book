<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CICAN Motion Test</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
#world{position:fixed;inset:0;overflow:hidden}
#cican{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:#fff;box-shadow:0 0 15px #fff,0 0 40px rgba(255,255,255,.7),0 0 80px rgba(255,255,255,.25);transition:box-shadow .15s}
.eye{position:absolute;top:32px;width:13px;height:22px;background:#000;border-radius:50%}
.eye.left{left:25px}.eye.right{right:25px}
#panel{position:fixed;left:14px;right:14px;top:14px;z-index:5;padding:16px;border:1px solid rgba(255,255,255,.22);border-radius:18px;background:rgba(0,0,0,.78);backdrop-filter:blur(8px)}
#title{font-size:18px;font-weight:800;letter-spacing:2px}
#status{margin-top:8px;font-size:13px;font-weight:700}
#values{margin-top:10px;font-family:monospace;font-size:12px;line-height:1.7;opacity:.82}
#hint{margin-top:10px;font-size:12px;line-height:1.5;opacity:.65}
button{margin-top:12px;padding:10px 15px;border:1px solid rgba(255,255,255,.35);border-radius:20px;background:#fff;color:#000;font-weight:800;touch-action:manipulation}
#bar{position:fixed;left:14px;right:14px;bottom:18px;height:5px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
#signal{height:100%;width:0;background:#fff;box-shadow:0 0 10px #fff}
</style>
</head>
<body>
<div id="world"><div id="cican"><div class="eye left"></div><div class="eye right"></div></div></div>
<div id="panel">
  <div id="title">CICAN — MOTION TEST</div>
  <div id="status">MOTION: WAITING FOR SENSOR</div>
  <div id="values">beta: --<br>gamma: --<br>relative beta: --<br>relative gamma: --<br>events: 0</div>
  <div id="hint">Hold the phone normally. Then slowly tilt left/right and forward/back. The CICAN should move clearly. This is an isolated sensor test — it does not change V16.</div>
  <button id="enable">ENABLE MOTION</button>
</div>
<div id="bar"><div id="signal"></div></div>
<script>
const cican=document.getElementById("cican");
const statusEl=document.getElementById("status");
const valuesEl=document.getElementById("values");
const enable=document.getElementById("enable");
const signal=document.getElementById("signal");

let baseBeta=null,baseGamma=null;
let beta=0,gamma=0,smoothBeta=0,smoothGamma=0;
let events=0,lastEvent=0,started=false;

function handle(e){
  if(typeof e.beta!=="number"||typeof e.gamma!=="number") return;
  if(baseBeta===null){baseBeta=e.beta;baseGamma=e.gamma}
  beta=Math.max(-45,Math.min(45,e.beta-baseBeta));
  gamma=Math.max(-45,Math.min(45,e.gamma-baseGamma));
  events++;
  lastEvent=performance.now();
  statusEl.textContent="MOTION: ACTIVE";
  statusEl.style.opacity="1";
}

async function start(){
  if(typeof DeviceOrientationEvent==="undefined"){
    statusEl.textContent="MOTION: NOT AVAILABLE";
    return;
  }
  if(typeof DeviceOrientationEvent.requestPermission==="function"){
    try{
      const permission=await DeviceOrientationEvent.requestPermission();
      if(permission!=="granted"){
        statusEl.textContent="MOTION: PERMISSION DENIED";
        return;
      }
    }catch(err){
      statusEl.textContent="MOTION: PERMISSION ERROR";
      return;
    }
  }
  window.addEventListener("deviceorientation",handle,{passive:true});
  if("ondeviceorientationabsolute" in window){
    window.addEventListener("deviceorientationabsolute",handle,{passive:true});
  }
  started=true;
  enable.style.display="none";
  statusEl.textContent="MOTION: LISTENING — MOVE PHONE";
}

enable.addEventListener("pointerdown",e=>{
  e.preventDefault();
  start();
},{passive:false});

if(typeof DeviceOrientationEvent!=="undefined" &&
   typeof DeviceOrientationEvent.requestPermission!=="function"){
  start();
}

function animate(){
  smoothBeta+=(beta-smoothBeta)*.14;
  smoothGamma+=(gamma-smoothGamma)*.14;

  const x=Math.max(45,Math.min(innerWidth-45,innerWidth/2+smoothGamma*10));
  const y=Math.max(45,Math.min(innerHeight-45,innerHeight/2+smoothBeta*7));
  cican.style.left=x+"px";
  cican.style.top=y+"px";

  const strength=Math.min(1,Math.sqrt(smoothBeta*smoothBeta+smoothGamma*smoothGamma)/20);
  cican.style.boxShadow=
    "0 0 "+(15+strength*20)+"px #fff,"+
    "0 0 "+(40+strength*45)+"px rgba(255,255,255,"+(0.7+strength*.2)+"),"+
    "0 0 "+(80+strength*80)+"px rgba(255,255,255,"+(0.25+strength*.25)+")";

  const age=performance.now()-lastEvent;
  if(started && age>2500){
    statusEl.textContent="MOTION: NO RECENT EVENTS";
  }

  valuesEl.innerHTML=
    "beta: "+(Number.isFinite(beta)?beta.toFixed(1):"--")+"°<br>"+
    "gamma: "+(Number.isFinite(gamma)?gamma.toFixed(1):"--")+"°<br>"+
    "relative beta: "+smoothBeta.toFixed(1)+"°<br>"+
    "relative gamma: "+smoothGamma.toFixed(1)+"°<br>"+
    "events: "+events;

  const signalValue=Math.min(100,Math.sqrt(smoothBeta*smoothBeta+smoothGamma*smoothGamma)*2.5);
  signal.style.width=signalValue+"%";

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
