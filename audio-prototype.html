<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CICAN — AUDIO PROTOTYPE</title>
<meta name="description" content="CICAN audio reading prototype for the Sacred Library.">
<meta name="theme-color" content="#000000">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;-webkit-font-smoothing:antialiased}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 18px 42px}
.shell{width:100%;max-width:760px;min-height:calc(100vh - 70px);display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{color:#fff;text-decoration:none;font-size:18px;font-weight:900;letter-spacing:-.06em}
.back{color:rgba(255,255,255,.42);text-decoration:none;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 0}
.eyebrow{color:rgba(255,255,255,.40);font-size:10px;font-weight:700;letter-spacing:.34em;text-transform:uppercase}
h1{margin-top:18px;font-size:clamp(28px,7vw,52px);font-weight:900;letter-spacing:-.055em}
.meta{margin-top:10px;color:rgba(255,255,255,.38);font-size:10px;letter-spacing:.13em;text-transform:uppercase}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:44px}
button{min-height:52px;padding:0 24px;border:1px solid rgba(255,255,255,.55);border-radius:100px;background:transparent;color:#fff;font-size:11px;font-weight:900;letter-spacing:.18em;cursor:pointer}
button.primary{background:#fff;color:#000}
button:disabled{opacity:.28;cursor:default}
.status{margin-top:22px;color:rgba(255,255,255,.35);font-size:10px;letter-spacing:.12em;text-transform:uppercase;min-height:16px}
.progress{width:min(520px,100%);height:2px;margin-top:22px;background:rgba(255,255,255,.10);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:#fff;transition:width .2s linear}
.note{max-width:560px;margin-top:34px;color:rgba(255,255,255,.20);font-size:10px;line-height:1.7;letter-spacing:.05em}
.footer{text-align:center;color:rgba(255,255,255,.22);font-size:9px;font-weight:800;letter-spacing:.30em;text-transform:uppercase}
</style>
</head>
<body>
<main class="page">
<div class="shell">
<header class="top">
<a class="logo" href="index.html">CICAN</a>
<a class="back" href="library.html">BACK</a>
</header>
<section class="main" aria-labelledby="title">
<div class="eyebrow">AUDIO PROTOTYPE</div>
<h1 id="title">LOADING…</h1>
<div class="meta" id="meta">Sacred Library</div>
<div class="controls">
<button class="primary" id="play" disabled>PLAY</button>
<button id="pause" disabled>PAUSE</button>
<button id="stop" disabled>STOP</button>
</div>
<div class="status" id="status">PREPARING AUDIO</div>
<div class="progress" aria-hidden="true"><i id="progress"></i></div>
<div class="note">Prototype only. Uses the device/browser speech engine; it does not change the locked V16 reader.</div>
</section>
<footer class="footer">CICAN</footer>
</div>
</main>
<script>
const SOURCES={
dhammapada:"books/dhammapada.js",
"tao-te-ching":"books/tao-te-ching.js"
};
const params=new URLSearchParams(location.search);
const bookId=params.get("book")||"dhammapada";
const source=SOURCES[bookId];
const title=document.getElementById("title");
const meta=document.getElementById("meta");
const play=document.getElementById("play");
const pause=document.getElementById("pause");
const stop=document.getElementById("stop");
const status=document.getElementById("status");
const progress=document.getElementById("progress");
let text="";
let chunks=[];
let index=0;
let speaking=false;

function setStatus(value){status.textContent=value}
function splitText(value){
const words=value.trim().split(/\s+/);
const out=[];
let current="";
for(const word of words){
if((current+" "+word).trim().length>1500){
if(current) out.push(current.trim());
current=word;
}else current=(current+" "+word).trim();
}
if(current) out.push(current);
return out;
}
function updateProgress(){
const pct=chunks.length?Math.round(index/chunks.length*100):0;
progress.style.width=pct+"%";
}
function speakNext(){
if(!speaking||index>=chunks.length){
if(index>=chunks.length){
speaking=false;
setStatus("COMPLETE");
updateProgress();
}
return;
}
const utterance=new SpeechSynthesisUtterance(chunks[index]);
utterance.rate=1;
utterance.pitch=1;
utterance.onend=()=>{
index++;
updateProgress();
if(speaking) speakNext();
};
utterance.onerror=()=>{
speaking=false;
setStatus("AUDIO ERROR");
};
speechSynthesis.speak(utterance);
setStatus("READING · "+Math.min(index+1,chunks.length)+" / "+chunks.length);
}
function start(){
if(!text||!window.speechSynthesis)return;
speechSynthesis.cancel();
speaking=true;
speakNext();
}
play.addEventListener("click",()=>{
if(!speaking) start();
});
pause.addEventListener("click",()=>{
if(speechSynthesis.speaking){speechSynthesis.pause();setStatus("PAUSED");}
});
stop.addEventListener("click",()=>{
speechSynthesis.cancel();
speaking=false;
index=0;
updateProgress();
setStatus("READY");
});
if(!("speechSynthesis" in window)){
title.textContent="AUDIO UNAVAILABLE";
meta.textContent="This browser does not expose speech synthesis.";
setStatus("USE A BROWSER WITH SPEECH SUPPORT");
}else if(!source){
title.textContent="TEXT NOT FOUND";
meta.textContent="Unknown Sacred Library text.";
setStatus("CHECK THE BOOK ID");
}else{
const script=document.createElement("script");
script.src=source+"?cican_audio="+Date.now();
script.onload=()=>{
if(!window.BOOK_READ){
setStatus("TEXT FAILED TO LOAD");
return;
}
title.textContent=window.BOOK_READ.title||"CICAN";
meta.textContent=[window.BOOK_READ.tradition,window.BOOK_READ.author].filter(Boolean).join(" · ");
text=window.BOOK_READ.text||"";
chunks=splitText(text);
play.disabled=false;
pause.disabled=false;
stop.disabled=false;
setStatus("READY · "+chunks.length+" AUDIO CHUNKS");
};
script.onerror=()=>setStatus("TEXT FAILED TO LOAD");
document.head.appendChild(script);
}
</script>
</body>
</html>
