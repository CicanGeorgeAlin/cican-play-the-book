<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no">

<title>CICAN — The Great Gatsby Test</title>

</head>

<body>

<script>

(async function () {

    const V14_URL =
        "v14.html";

    const ORIGINAL_BOOK =
        "books/nineteen-eighty-four.js";

    const TEST_BOOK =
        "books/the-great-gatsby.js";


    try {

        const response =
            await fetch(
                V14_URL +
                "?gatsby-test=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Could not load V14. HTTP " +
                response.status
            );

        }


        let v14 =
            await response.text();


        if (
            !v14.includes(
                ORIGINAL_BOOK
            )
        ) {

            throw new Error(
                "The original V14 book reference was not found."
            );

        }


        /*
         * EXACT V14.
         *
         * ONLY the book file is changed.
         */

        v14 =
            v14.replace(
                ORIGINAL_BOOK,
                TEST_BOOK
            );


        document.open();

        document.write(
            v14
        );

        document.close();


    } catch (error) {

        document.body.innerHTML =
            "";


        const message =
            document.createElement(
                "div"
            );


        message.textContent =
            "CICAN TEST ERROR: " +
            (
                error.message ||
                String(error)
            );


        message.style.cssText =
            "min-height:100vh;" +
            "display:flex;" +
            "align-items:center;" +
            "justify-content:center;" +
            "padding:24px;" +
            "box-sizing:border-box;" +
            "background:#000;" +
            "color:#fff;" +
            "font-family:Arial,sans-serif;" +
            "text-align:center;";


        document.body.appendChild(
            message
        );


        console.error(
            "CICAN Gatsby test:",
            error
        );

    }

})();

</script>

</body>

</html>
