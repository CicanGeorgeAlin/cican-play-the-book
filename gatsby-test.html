<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no">

<title>CICAN — The Great Gatsby</title>

</head>

<body>

<script>

(async function () {

    const V14_FILE =
        "v14.html";

    const BOOK_1 =
        "books/nineteen-eighty-four.js";

    const BOOK_2 =
        "books/the-great-gatsby.js";


    try {

        const response =
            await fetch(
                V14_FILE +
                "?gatsby-test=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Could not load v14.html. HTTP " +
                response.status
            );

        }


        let html =
            await response.text();


        if (
            html.indexOf(
                BOOK_1
            ) === -1
        ) {

            throw new Error(
                "The original V14 book reference was not found."
            );

        }


        /*
         * ONLY CHANGE:
         *
         * Nineteen Eighty-Four
         *        ↓
         * The Great Gatsby
         *
         * Everything else remains
         * the original V14.
         */

        html =
            html.replace(
                BOOK_1,
                BOOK_2
            );


        document.open();

        document.write(
            html
        );

        document.close();


    } catch (error) {

        document.body.innerHTML = "";


        const box =
            document.createElement(
                "div"
            );


        box.style.cssText =
            "min-height:100vh;" +
            "display:flex;" +
            "align-items:center;" +
            "justify-content:center;" +
            "padding:24px;" +
            "box-sizing:border-box;" +
            "background:#000;" +
            "color:#fff;" +
            "font-family:Arial,sans-serif;" +
            "text-align:center;";


        const message =
            document.createElement(
                "div"
            );


        const title =
            document.createElement(
                "div"
            );


        title.textContent =
            "CICAN — TEST ERROR";

        title.style.cssText =
            "font-size:22px;" +
            "margin-bottom:12px;";


        const details =
            document.createElement(
                "div"
            );


        details.textContent =
            error &&
            error.message
                ? error.message
                : String(error);

        details.style.cssText =
            "opacity:.7;" +
            "font-size:14px;";


        message.appendChild(
            title
        );

        message.appendChild(
            details
        );

        box.appendChild(
            message
        );

        document.body.appendChild(
            box
        );


        console.error(
            "CICAN Gatsby test:",
            error
        );

    }

})();

</script>

</body>

</html>
