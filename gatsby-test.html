<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no">

<title>CICAN — The Great Gatsby Test</title>

</head>

<body>

<script>

(async function () {

    const V14_URL =
        "v14.html";

    const GATSBY_BOOK =
        "books/the-great-gatsby.js";

    const ORIGINAL_BOOK =
        "books/nineteen-eighty-four.js";


    try {

        const response =
            await fetch(
                V14_URL +
                "?gatsby-test=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Could not load v14.html (" +
                response.status +
                ")"
            );

        }


        let v14 =
            await response.text();


        if (
            !v14.includes(
                ORIGINAL_BOOK
            )
        ) {

            throw new Error(
                "The expected V14 book reference was not found."
            );

        }


        /*
         * IMPORTANT:
         *
         * This loads the EXACT current V14.
         *
         * The ONLY change is:
         *
         * Nineteen Eighty-Four
         *
         * becomes
         *
         * The Great Gatsby
         *
         * The V14 engine itself is not changed.
         */


        v14 =
            v14.replace(
                ORIGINAL_BOOK,
                GATSBY_BOOK
            );


        document.open();

        document.write(
            v14
        );

        document.close();


    } catch (error) {

        document.body.innerHTML = "";


        const box =
            document.createElement(
                "div"
            );


        box.style.cssText =
            [
                "min-height:100vh",
                "display:flex",
                "align-items:center",
                "justify-content:center",
                "padding:24px",
                "box-sizing:border-box",
                "background:#000",
                "color:#fff",
                "font-family:Arial,sans-serif",
                "text-align:center"
            ].join(";");


        const message =
            document.createElement(
                "div"
            );


        const title =
            document.createElement(
                "div"
            );


        title.textContent =
            "CICAN — TEST ERROR";


        title.style.cssText =
            [
                "font-size:22px",
                "margin-bottom:12px"
            ].join(";");


        const details =
            document.createElement(
                "div"
            );


        details.textContent =
            error &&
            error.message
                ? error.message
                : String(error);


        details.style.cssText =
            [
                "opacity:.7",
                "font-size:14px"
            ].join(";");


        message.appendChild(
            title
        );


        message.appendChild(
            details
        );


        box.appendChild(
            message
        );


        document.body.appendChild(
            box
        );


        console.error(
            "CICAN Gatsby test:",
            error
        );

    }

})();

</script>

</body>

</html>
