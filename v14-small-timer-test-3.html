<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CICAN — PLAY THE BOOK V14 Small Timer Test</title>
<style>
html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#000;
}
iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
    background:#000;
}
</style>
</head>
<body>

<iframe
    id="v14Frame"
    src="v14.html"
    title="CICAN — PLAY THE BOOK V14">
</iframe>

<script>
/*
==================================================
CICAN — PLAY THE BOOK
V14 SMALL MOVABLE TIMER TEST

SAFE TEST COPY.

v14.html is loaded unchanged.

Only the existing reader HUD is refined:
- small timer
- readable percentage
- no progress bar
- movable HUD

The original V14 reader, auto-reader, PAUSE button,
READ AGAIN, game mechanics, and reader layout are
not replaced.
==================================================
*/

const frame =
    document.getElementById("v14Frame");

frame.addEventListener("load", function () {

    const win =
        frame.contentWindow;

    const doc =
        frame.contentDocument;

    if (!win || !doc) {
        return;
    }

    const hud =
        doc.getElementById("readerHUD");

    const panel =
        doc.querySelector(".reader-panel");

    const timer =
        doc.getElementById("readerTimer");

    const percent =
        doc.getElementById("readerPercent");

    if (!hud || !panel || !timer || !percent) {
        return;
    }

    /*
    ================================================
    SMALL HUD DESIGN
    ================================================
    */

    hud.style.position = "absolute";

    hud.style.right = "12px";
    hud.style.bottom = "12px";

    hud.style.left = "auto";
    hud.style.top = "auto";

    hud.style.width = "auto";
    hud.style.minWidth = "64px";

    hud.style.padding = "6px 8px";

    hud.style.gap = "4px";

    hud.style.borderRadius = "9px";

    hud.style.background =
        "rgba(0,0,0,0.76)";

    hud.style.border =
        "1px solid rgba(255,255,255,0.16)";

    hud.style.backdropFilter =
        "blur(6px)";

    hud.style.webkitBackdropFilter =
        "blur(6px)";

    hud.style.boxShadow =
        "0 4px 14px rgba(0,0,0,0.30)";

    hud.style.pointerEvents = "auto";

    hud.style.touchAction = "none";

    hud.style.userSelect = "none";

    hud.style.webkitUserSelect = "none";

    hud.style.cursor = "grab";

    hud.style.webkitTapHighlightColor =
        "transparent";


    /*
    ================================================
    TIMER
    ================================================
    */

    timer.style.fontSize = "13px";

    timer.style.lineHeight = "1";

    timer.style.fontWeight = "bold";

    timer.style.letterSpacing = "0.2px";

    timer.style.fontVariantNumeric =
        "tabular-nums";

    timer.style.margin = "0";

    timer.style.whiteSpace = "nowrap";


    /*
    ================================================
    PERCENTAGE
    ================================================
    */

    percent.style.fontSize = "10px";

    percent.style.lineHeight = "1";

    percent.style.fontWeight = "500";

    percent.style.opacity = "0.82";

    percent.style.letterSpacing = "0.4px";

    percent.style.margin = "0";

    percent.style.whiteSpace = "nowrap";


    /*
    ================================================
    REMOVE ONLY THE OLD PROGRESS BAR
    ================================================
    */

    const progress =
        doc.getElementById(
            "readerProgress"
        );

    if (progress) {
        progress.style.display = "none";
    }


    /*
    ================================================
    DRAG STATE
    ================================================
    */

    let dragging = false;

    let pointerId = null;

    let offsetX = 0;

    let offsetY = 0;


    /*
    ================================================
    START DRAG
    ================================================
    */

    function beginDrag(e) {

        e.preventDefault();

        e.stopPropagation();

        const hudRect =
            hud.getBoundingClientRect();

        const panelRect =
            panel.getBoundingClientRect();

        dragging = true;

        pointerId =
            e.pointerId;

        offsetX =
            e.clientX -
            hudRect.left;

        offsetY =
            e.clientY -
            hudRect.top;


        /*
        Convert the original right/bottom
        position to left/top coordinates.
        */

        hud.style.left =
            (
                hudRect.left -
                panelRect.left
            ) + "px";

        hud.style.top =
            (
                hudRect.top -
                panelRect.top
            ) + "px";

        hud.style.right = "auto";

        hud.style.bottom = "auto";

        hud.style.cursor = "grabbing";

        hud.style.boxShadow =
            "0 0 16px rgba(255,255,255,0.13)";


        try {
            hud.setPointerCapture(
                e.pointerId
            );
        } catch (_) {}

    }


    /*
    ================================================
    MOVE
    ================================================
    */

    function moveDrag(e) {

        if (
            !dragging ||
            e.pointerId !== pointerId
        ) {
            return;
        }

        e.preventDefault();

        e.stopPropagation();

        const panelRect =
            panel.getBoundingClientRect();

        const hudRect =
            hud.getBoundingClientRect();

        const padding = 6;

        let left =
            e.clientX -
            panelRect.left -
            offsetX;

        let top =
            e.clientY -
            panelRect.top -
            offsetY;

        const maxLeft =
            Math.max(
                padding,
                panelRect.width -
                hudRect.width -
                padding
            );

        const maxTop =
            Math.max(
                padding,
                panelRect.height -
                hudRect.height -
                padding
            );

        left =
            Math.max(
                padding,
                Math.min(
                    maxLeft,
                    left
                )
            );

        top =
            Math.max(
                padding,
                Math.min(
                    maxTop,
                    top
                )
            );

        hud.style.left =
            left + "px";

        hud.style.top =
            top + "px";

    }


    /*
    ================================================
    END DRAG
    ================================================
    */

    function endDrag(e) {

        if (!dragging) {
            return;
        }

        if (
            e &&
            e.pointerId !== pointerId
        ) {
            return;
        }

        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        dragging = false;

        hud.style.cursor = "grab";

        hud.style.boxShadow =
            "0 4px 14px rgba(0,0,0,0.30)";

        try {
            hud.releasePointerCapture(
                pointerId
            );
        } catch (_) {}

        pointerId = null;

    }


    /*
    ================================================
    POINTER EVENTS
    ================================================
    */

    hud.addEventListener(
        "pointerdown",
        beginDrag,
        { passive: false }
    );

    hud.addEventListener(
        "pointermove",
        moveDrag,
        { passive: false }
    );

    hud.addEventListener(
        "pointerup",
        endDrag,
        { passive: false }
    );

    hud.addEventListener(
        "pointercancel",
        endDrag,
        { passive: false }
    );


    /*
    ================================================
    KEEP HUD INSIDE READER
    ================================================
    */

    win.addEventListener(
        "resize",
        function () {

            if (!hud.style.left) {
                return;
            }

            const panelRect =
                panel.getBoundingClientRect();

            const hudRect =
                hud.getBoundingClientRect();

            const padding = 6;

            let left =
                parseFloat(
                    hud.style.left
                );

            let top =
                parseFloat(
                    hud.style.top
                );

            if (!Number.isFinite(left)) {
                left = padding;
            }

            if (!Number.isFinite(top)) {
                top = padding;
            }

            const maxLeft =
                Math.max(
                    padding,
                    panelRect.width -
                    hudRect.width -
                    padding
                );

            const maxTop =
                Math.max(
                    padding,
                    panelRect.height -
                    hudRect.height -
                    padding
                );

            left =
                Math.max(
                    padding,
                    Math.min(
                        maxLeft,
                        left
                    )
                );

            top =
                Math.max(
                    padding,
                    Math.min(
                        maxTop,
                        top
                    )
                );

            hud.style.left =
                left + "px";

            hud.style.top =
                top + "px";

        }
    );

});

</script>

</body>
</html>
